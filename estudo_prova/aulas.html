<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Estudos EEE933</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
:root{
  /* Layout: caderno de laboratório. Trilho de fases à esquerda, coluna de leitura de ~70ch à direita, cabeçalhos sobre papel milimetrado. */
  --paper:#f4f6fa;
  --paper-glass:rgba(244,246,250,.88);
  --card:#ffffff;
  --ink:#172033;
  --muted:#586379;
  --line:#d7dde9;
  --accent:#2445c4;
  --accent-ink:#ffffff;
  --accent-soft:#e6ebfa;
  --amber:#a35200;
  --amber-soft:#fcefdc;
  --good:#1b7246;
  --good-soft:#e1f2e8;
  --bad:#ad2a20;
  --bad-soft:#fae5e2;
  --code:#ebeef5;
  --grid:rgba(36,69,196,.075);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e131d; --paper-glass:rgba(14,19,29,.86); --card:#151c29; --ink:#e4e9f2; --muted:#9aa5b9; --line:#29334a;
    --accent:#8fa6ff; --accent-ink:#0e131d; --accent-soft:#1b2646;
    --amber:#f0a24a; --amber-soft:#2c2213; --good:#5fd39a; --good-soft:#11281d; --bad:#ff8b7f; --bad-soft:#331a1a;
    --code:#1a2232; --grid:rgba(143,166,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e131d; --paper-glass:rgba(14,19,29,.86); --card:#151c29; --ink:#e4e9f2; --muted:#9aa5b9; --line:#29334a;
  --accent:#8fa6ff; --accent-ink:#0e131d; --accent-soft:#1b2646;
  --amber:#f0a24a; --amber-soft:#2c2213; --good:#5fd39a; --good-soft:#11281d; --bad:#ff8b7f; --bad-soft:#331a1a;
  --code:#1a2232; --grid:rgba(143,166,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.62}
a{color:var(--accent);text-underline-offset:.15em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper-glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:.8rem 1.2rem;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.06rem;letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:.5rem}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.7rem;color:var(--muted);letter-spacing:.05em}
.top-links{display:flex;gap:1rem;font-size:.92rem}
.top-links a{text-decoration:none;font-weight:700}
.progress{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}

/* tipografia */
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.2vw,2.75rem);line-height:1.07;letter-spacing:-.025em;text-wrap:balance;margin:.35rem 0 .7rem}
h2{font-family:var(--f-display);font-weight:700;font-size:1.48rem;line-height:1.2;letter-spacing:-.012em;margin:2.4rem 0 .6rem;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.13rem;line-height:1.3;margin:1.6rem 0 .4rem;text-wrap:balance}
p{margin:.65rem 0}
ul,ol{padding-left:1.3rem;margin:.6rem 0}
li{margin:.28rem 0}
strong{font-weight:700}
.lead{font-size:1.2rem;line-height:1.5;max-width:62ch}
.muted{color:var(--muted)}
.prose{max-width:72ch}
.m{font-family:var(--f-math);font-style:italic;font-size:1.1em;white-space:nowrap}
.formula{font-family:var(--f-math);font-size:1.18rem;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem 1rem;margin:.9rem 0;overflow-x:auto;text-align:center}
.formula small{display:block;font-family:var(--f-body);font-size:.82rem;color:var(--muted);margin-top:.25rem}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code);padding:.08em .35em;border-radius:4px}
pre.r{font-family:var(--f-mono);font-size:.82rem;line-height:1.55;background:var(--code);border-radius:10px;padding:.85rem 1rem;margin:.9rem 0;overflow-x:auto;white-space:pre}
pre.r .c{color:var(--muted)}
.papel{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}

/* notas */
.note{border-radius:12px;padding:.85rem 1.1rem;margin:1.1rem 0;background:var(--card);border:1px solid var(--line)}
.note > .tag{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.16rem .55rem;border-radius:999px;margin-bottom:.35rem;background:var(--line);color:var(--ink)}
.note > p:last-child,.note > ul:last-child,.note > ol:last-child{margin-bottom:0}
.note.analogia{background:var(--accent-soft);border-color:transparent}
.note.analogia > .tag{background:var(--accent);color:var(--accent-ink)}
.note.pegadinha{background:var(--amber-soft);border-color:transparent}
.note.pegadinha > .tag{background:var(--amber);color:var(--card)}
.note.ec > .tag{background:var(--ink);color:var(--paper)}
.note.exemplo > .tag{background:var(--code);color:var(--ink);border:1px solid var(--line)}

/* tabelas */
.tw{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.45}
table.t th,table.t td{padding:.55rem .7rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th{font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
table.t td:first-child{font-weight:700}
table.t.num td{font-variant-numeric:tabular-nums}

/* passos numerados (sequências reais) */
ol.passos{list-style:none;padding:0;counter-reset:p;display:grid;gap:.55rem;margin:1rem 0}
ol.passos > li{counter-increment:p;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.7rem;align-items:start;margin:0}
ol.passos > li::before{content:counter(p);font-family:var(--f-mono);font-weight:600;font-size:.82rem;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--accent);color:var(--accent)}
ol.passos > li > div{min-width:0;padding-top:.2rem}

/* botões e controles */
.btn{font:inherit;font-weight:700;font-size:.95rem;border-radius:999px;padding:.5rem 1.05rem;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.86rem;padding:.35rem .8rem;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
input[type=range]{accent-color:var(--accent);width:100%}
select{font:inherit;font-size:.9rem;padding:.25rem .4rem;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{font:inherit;font-size:.98rem;line-height:1.5;width:100%;min-height:14rem;padding:.8rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}

/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.9rem 0}
.q-n{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.q-text{font-weight:700;margin:.25rem 0 .75rem;line-height:1.45}
.q-text pre.r{font-weight:400}
.opts{display:grid;gap:.5rem}
.opt{display:grid;grid-template-columns:1.7rem minmax(0,1fr);gap:.65rem;align-items:start;text-align:left;width:100%;font:inherit;font-size:.98rem;line-height:1.45;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .75rem;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;font-size:.78rem;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card)}
.opt[disabled]{cursor:default}
.opt.marcada{border-color:var(--accent)}
.opt.marcada .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.certa{background:var(--good-soft);border-color:var(--good)}
.opt.certa .k{background:var(--good);color:var(--card);border-color:var(--good)}
.opt.errada{background:var(--bad-soft);border-color:var(--bad)}
.opt.errada .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.exp{margin-top:.75rem;padding:.7rem .9rem;border-radius:10px;background:var(--paper);border:1px dashed var(--line);font-size:.96rem}
.exp .ok{color:var(--good);font-weight:700}
.exp .no{color:var(--bad);font-weight:700}
.stars{font-size:1rem;letter-spacing:.1em;color:var(--line);white-space:nowrap}
.stars b{color:var(--amber);font-weight:400}

/* widgets */
.widget{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin:1.4rem 0}
.w-head{display:flex;flex-direction:column;gap:.1rem;margin-bottom:.7rem}
.w-head b{font-family:var(--f-display);font-size:1.05rem}
.w-head span{font-size:.88rem;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:center;margin:.5rem 0 .8rem;font-size:.92rem}
.ctrl label{display:flex;flex-direction:column;gap:.15rem;min-width:9rem;flex:1 1 9rem}
.ctrl label span{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.ctrl label span b{color:var(--ink);font-weight:600}
svg.plot{width:100%;height:auto;display:block;overflow:visible}
svg.plot text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.plot .axis{stroke:var(--line);stroke-width:1}
.w-out{font-family:var(--f-mono);font-size:.84rem;color:var(--ink);margin:.6rem 0 0;font-variant-numeric:tabular-nums}
.w-out b{color:var(--accent)}
.readout{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.readout div{flex:1 1 7.5rem;background:var(--paper);border-radius:9px;padding:.45rem .7rem}
.readout div span{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout div b{font-family:var(--f-mono);font-size:1.02rem;font-variant-numeric:tabular-nums}
/* marcas dos gráficos */
svg.plot .p-bar{fill:var(--accent);fill-opacity:.55}
svg.plot .p-curve{fill:none;stroke:var(--ink);stroke-width:2}
svg.plot .p-mu{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
svg.plot .p-ok{stroke:var(--good)}
svg.plot .p-no{stroke:var(--bad)}
svg.plot .p-okf{fill:var(--good)}
svg.plot .p-nof{fill:var(--bad)}
svg.plot .p-h0{fill:none;stroke:var(--muted);stroke-width:2}
svg.plot .p-h1{fill:none;stroke:var(--accent);stroke-width:2.2}
svg.plot .p-alpha{fill:var(--bad);fill-opacity:.45}
svg.plot .p-beta{fill:var(--amber);fill-opacity:.3}
svg.plot .p-power{fill:var(--good);fill-opacity:.28}
svg.plot .p-crit{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
svg.plot .p-mean{stroke:var(--ink);stroke-width:2.5}
svg.plot .g0{fill:var(--accent)}
svg.plot .g1{fill:var(--amber)}
svg.plot .g2{fill:var(--good)}
svg.plot .p-line0{stroke:var(--accent);stroke-width:3}
svg.plot .p-line1{stroke:var(--amber);stroke-width:3}
svg.plot text.p-lbl0{fill:var(--accent);font-weight:600}
svg.plot text.p-lbl1{fill:var(--amber);font-weight:600}

/* --- específico da trilha --- */
.shell{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:1.4rem 4rem;display:grid;grid-template-columns:250px minmax(0,1fr);gap:2.6rem}
@media (max-width:920px){.shell{grid-template-columns:minmax(0,1fr);gap:.6rem}}
.navbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.6rem);align-self:start;max-height:calc(100vh - 4.8rem);overflow:auto}
@media (max-width:920px){.navbox{position:static;max-height:none;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.2rem .6rem}}
.navbox summary{font-family:var(--f-display);font-weight:700;cursor:pointer;padding:.55rem .2rem;list-style-position:inside}
@media (min-width:921px){.navbox summary{display:none}}
.trilho{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.trilho a{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.4rem;align-items:center;padding:.42rem .5rem;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.25}
.trilho a:hover{background:var(--card)}
.trilho a[aria-current="page"]{background:var(--accent-soft);font-weight:700}
.trilho .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.trilho .stars{font-size:.7rem;letter-spacing:0}
.trilho .sep{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:.9rem .5rem .3rem}
main{min-width:0}
.fase-head{border-radius:16px;padding:1.4rem 1.3rem 1.2rem;border:1px solid var(--line);background-color:var(--card)}
.fase-head .lead{margin:0}
.fase-meta{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.9rem;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.fase-meta span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.12rem .6rem}
.quiz{margin-top:2.8rem;padding-top:1.3rem;border-top:2px solid var(--ink)}
.quiz-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1rem;justify-content:space-between}
.quiz-head h2{margin:0}
.resultado{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem;margin-top:1rem;padding:1rem 1.1rem;border-radius:12px;background:var(--accent-soft)}
.resultado .big{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.resultado .stars{font-size:1.4rem}
.pn{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.pn a{text-decoration:none;display:flex;flex-direction:column;gap:.1rem;max-width:48%}
.pn a span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.pn a b{font-family:var(--f-display)}
.pn a.next{margin-left:auto;text-align:right}
/* início */
.hero{border-radius:18px;padding:1.8rem 1.4rem 1.5rem;border:1px solid var(--line);background-color:var(--card)}
.hero h1{max-width:20ch}
.hero-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem}
.contagem{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
.contagem div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;min-width:8.5rem}
.contagem span{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.contagem b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:.75rem;margin-top:1rem}
.cartao{display:flex;flex-direction:column;gap:.25rem;padding:.95rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);min-height:8.4rem}
.cartao:hover{border-color:var(--accent)}
.cartao .num{font-family:var(--f-display);font-weight:800;font-size:1.65rem;line-height:1;color:var(--accent)}
.cartao .tit{font-family:var(--f-display);font-weight:700;font-size:1.04rem;line-height:1.25}
.cartao .ref{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:auto}
.cartao .stars{font-size:.85rem}
.cartao.destaque{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cartao.destaque .num,.cartao.destaque .ref{color:var(--paper)}
.cartao.destaque .ref{opacity:.75}
</style>
</head>

<script>
const FASES = [];
FASES.push(
/* ===================================================== FASE 0 */
{
id:'fio', n:0, grupo:'Comece aqui',
titulo:'O que os 3 estudos de caso têm em comum',
aula:'EC01 · EC02 · EC03', slides:'ec1/, ec2/, ec3/ + slides 00 e 02',
tldr:'Os três estudos de caso são o mesmo experimento com roupas diferentes: comparar a média de uma variável de resposta entre os níveis de um fator, com um teste de hipóteses, seguindo sempre o mesmo roteiro de planejamento e análise.',
html:`
<h2>A resposta curta</h2>
<p>IMC de alunos (EC01), retorno de ações (EC02) e desempenho de um algoritmo (EC03) parecem assuntos sem relação. Mas, olhando o <strong>método</strong>, os três relatórios fazem as mesmas coisas, na mesma ordem:</p>
<ol class="passos">
<li><div><strong>Transformam uma pergunta técnica em hipóteses sobre médias.</strong> <span class="m">H₀</span> diz “não há diferença”; <span class="m">H₁</span> diz “há diferença”.</div></li>
<li><div><strong>Fixam os parâmetros do planejamento:</strong> nível de significância <span class="m">α = 0,05</span>, efeito minimamente relevante <span class="m">δ*</span>, poder <span class="m">1 − β</span> e tamanho amostral.</div></li>
<li><div><strong>Preparam os dados</strong> antes de qualquer teste: filtrar e consolidar arquivos e calcular o IMC (EC01), calcular retornos mensais (EC02), agregar as repetições por instância (EC03).</div></li>
<li><div><strong>Fazem uma análise exploratória</strong>, sempre com boxplot, para enxergar diferenças, dispersão e outliers.</div></li>
<li><div><strong>Aplicam um teste paramétrico da família t/F:</strong> t de duas amostras (EC01), ANOVA + comparações múltiplas (EC02), t pareado (EC03).</div></li>
<li><div><strong>Validam as mesmas três premissas:</strong> normalidade (Shapiro-Wilk + QQ-plot), igualdade de variâncias (Fligner-Killeen) e independência (planejamento + Durbin-Watson).</div></li>
<li><div><strong>Medem o tamanho do efeito com intervalo de confiança</strong>, e não só o p-valor.</div></li>
<li><div><strong>Discutem o poder do teste</strong> (<code>power.t.test</code>), tiram conclusões no contexto da pergunta e apontam limitações e melhorias.</div></li>
</ol>
<p>E todos são entregues no <strong>mesmo formato de relatório</strong> (template R Markdown do slide 00, p. 8): Resumo → Introdução → Planejamento (hipóteses + coleta) → Análise exploratória → Análise estatística (premissas + resultados) → Conclusões e recomendações, com papéis da equipe e declaração de uso de IA.</p>

<h2>Um único modelo por trás de tudo</h2>
<p>Os três testes são casos particulares do mesmo modelo linear de efeitos:</p>
<div class="formula">y<sub>ij</sub> = μ + τ<sub>i</sub> + (β<sub>j</sub>) + ε<sub>ij</sub>, &nbsp; ε<sub>ij</sub> ~ iid N(0, σ²)<small>μ = média global · τ = efeito do tratamento · β = efeito do bloco (quando existe) · ε = resíduo</small></div>
<ul>
<li><strong>EC01:</strong> 2 níveis, sem bloco → teste t de duas amostras.</li>
<li><strong>EC02:</strong> 5 níveis, sem bloco → ANOVA de um fator.</li>
<li><strong>EC03:</strong> 2 níveis com bloco (instância). Ao subtrair as duas configurações na mesma instância, <span class="m">β<sub>j</sub></span> se cancela e sobra um teste t pareado.</li>
</ul>
<p>É por isso que as premissas são sempre as mesmas: elas são premissas sobre o resíduo <span class="m">ε</span>. Ele deve ser <strong>independente</strong>, <strong>normal</strong> e com <strong>variância constante</strong>.</p>

<h2>O roteiro que você vai escrever na prova</h2>
<h3>Planejamento (antes de coletar)</h3>
<ol class="passos">

<li><div><strong>Fatores, níveis e unidade experimental.</strong> Identifique fatores indesejáveis e decida entre aleatorizar, parear ou bloquear.</div></li>
<li><div><strong>Nível de confiança e poder:</strong> α, β e o efeito minimamente relevante δ*.</div></li>
<li><div><strong>Tamanho amostral:</strong> estime σ (histórico, conhecimento do processo ou piloto) e calcule <span class="m">n</span> (fórmula ou <code>power.t.test</code>).</div></li>
<li><div><strong>Protocolo de coleta:</strong> ordem aleatória, condições homogêneas, sem paradas prematuras e sem espiar os dados.</div></li>
<li><div><strong>Plano de análise:</strong> qual teste, quais premissas verificar, plano B (transformação ou não paramétrico) e comparações múltiplas planejadas.</div></li>

<h3>Análise (depois de coletar)</h3>

<li><div><strong>Estatística de teste e p-valor</strong> → decisão: rejeitar <span class="m">H₀</span> se <span class="m">p ≤ α</span>.</div></li>
<li><div><strong>Validação das premissas</strong> nos resíduos: normalidade, homoscedasticidade, independência.</div></li>
<li><div><strong>Comparações múltiplas</strong>, se houver mais de 2 níveis (Tukey ou Dunnett).</div></li>
<li><div><strong>Magnitude do efeito com IC</strong>, comparada com δ* (significância prática).</div></li>
<li><div><strong>Poder</strong>: o experimento tinha sensibilidade para detectar δ*?</div></li>
<li><div><strong>Conclusões e recomendações</strong> no contexto da pergunta, com limitações e melhorias.</div></li>
</ol>

html:`
<h2>O que a ciência <em>não</em> é</h2>
<p>A aula começa derrubando concepções comuns. A ciência <strong>não</strong> é:</p>
<ul>
<li>apenas um conjunto de fatos, nem apenas a criação de novos dispositivos;</li>
<li>um corpo de ideias absolutas e imutáveis, nem algo “não confiável” só porque muda;</li>
<li>um processo em que as observações dão respostas diretamente ao cientista;</li>
<li>algo que “prova” coisas, nem algo que só sabe refutar;</li>
<li>o trabalho de alguém que tenta mostrar que a própria teoria está certa.</li>
</ul>
<p>Definição prática (Steven Novella, citado no slide): <em>um modo sistemático de observar cuidadosamente a natureza e usar lógica consistente para avaliar os resultados.</em> Não há nada de mágico.</p>
<p>Lembre-se da distinção entre <strong>fatos</strong> (observações), <strong>hipóteses</strong> (explicações testáveis), <strong>teorias</strong> (explicações amplas e bem sustentadas) e <strong>leis</strong> (descrições de regularidades).</p>

<h2>A “receita” e o processo real</h2>
<p>A versão de livro escolar tem 5 passos: pergunta → hipótese → experimento → dados → conclusão. O slide avisa que isso é uma <strong>simplificação</strong> de um processo complexo, <strong>iterativo</strong> e <strong>sem etapa final</strong>. O processo real se organiza em 4 grupos de atividades que se retroalimentam:</p>
<div class="tw"><table class="t">
<thead><tr><th>Grupo</th><th>O que envolve</th></tr></thead>
<tbody>
<tr><td>Explorar e descobrir</td><td>Observar, fazer perguntas, ler a literatura, usar novas tecnologias, achar motivações.</td></tr>
<tr><td>Testar ideias</td><td>Formular hipóteses, testá-las, confrontar o esperado com o observado, aceitar ou rejeitar ideias pelas evidências, revisar premissas.</td></tr>
<tr><td>Análise e feedback da comunidade</td><td>Colegas, colaboradores, revisores e “rivais”. Gera críticas, inspiração, atenção e motivação. Inclui a revisão por pares.</td></tr>
<tr><td>Benefícios e desdobramentos</td><td>Novos conhecimentos, solução de problemas práticos, novas tecnologias, subsídio a políticas públicas, curiosidade satisfeita.</td></tr>
</tbody></table></div>

<h3>Serendipidade</h3>
<p>“O acaso só favorece as mentes preparadas” (Pasteur). Exemplos do slide: Kekulé propôs a estrutura do benzeno após sonhar com uma cobra mordendo o próprio rabo; Fleming descobriu a penicilina ao notar que um mofo havia contaminado uma cultura esquecida e separado as bactérias.</p>

<h3>Revisão por pares e reprodutibilidade</h3>
<ol class="passos">
<li><div>Realizamos a pesquisa e escrevemos o artigo.</div></li>
<li><div>O editor recebe o artigo e pode recusá-lo.</div></li>
<li><div>Os revisores avaliam: recusar, pedir revisão ou aceitar.</div></li>
<li><div>O artigo é publicado e a comunidade tem acesso a ele.</div></li>
<li><div>Os resultados são replicados e verificados (<strong>reprodutibilidade</strong>).</div></li>
</ol>

<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>A exigência de entregar o <code>.Rmd</code> que compila sem erros, junto com os dados, é a reprodutibilidade na prática. Qualquer pessoa precisa conseguir refazer sua análise.</p></div>

<div class="note analogia"><span class="tag">Analogia</span>
<p>A ciência funciona como um mapa feito por exploradores. Cada expedição volta com medições novas e o mapa é corrigido. Ele nunca está “provado”, mas fica cada vez mais confiável, e você não jogaria fora o mapa só porque ele já foi corrigido antes.</p></div>

<div class="note pegadinha"><span class="tag">Pegadinha</span>
<p>“A ciência prova” e “a ciência só refuta” estão <strong>ambas</strong> na lista de concepções erradas. A mesma ideia volta na aula 02: rejeitar <span class="m">H₀</span> não prova nada, apenas quantifica de forma objetiva a plausibilidade de uma afirmação.</p></div>

html:`
<h2>Vocabulário que cai em prova</h2>
<div class="tw"><table class="t">
<thead><tr><th>Termo</th><th>Definição (slide 4)</th><th>Exemplo: papel (aula 08)</th></tr></thead>
<tbody>
<tr><td>Experimento</td><td>Variação forçada de uma ou mais variáveis controláveis de um processo para avaliar o efeito na saída.</td><td>Produzir papel com fibras diferentes e medir a resistência.</td></tr>
<tr><td>Fator</td><td>Variável controlável cuja influência na saída está sob estudo.</td><td>Tipo de fibra de madeira.</td></tr>
<tr><td>Nível</td><td>Valores (não necessariamente numéricos) que um fator pode assumir.</td><td>A, B, C, D.</td></tr>
<tr><td>Tratamento</td><td>Combinação específica dos níveis de <em>todos</em> os fatores.</td><td>Com um único fator, cada fibra é um tratamento.</td></tr>
<tr><td>Variável de resposta</td><td>A saída medida.</td><td>Resistência à tração (kPa).</td></tr>
</tbody></table></div>
<p>Objetivos típicos de um experimento: identificar as variáveis que mais influenciam o processo, determinar o valor necessário de alguma variável e caracterizar o comportamento do sistema.</p>

<div class="note analogia"><span class="tag">Analogia</span>
<p>No fogão, cada botão é um <strong>fator</strong>, cada posição do botão é um <strong>nível</strong> e a combinação de todas as posições ao mesmo tempo é um <strong>tratamento</strong>. O sabor do prato é a <strong>resposta</strong>.</p></div>

<h2>Três tipos de estudo</h2>
<div class="tw"><table class="t">
<thead><tr><th>Tipo</th><th>Característica</th><th>Problemas</th><th>Nos ECs</th></tr></thead>
<tbody>
<tr><td>Retrospectivo</td><td>Usa dados históricos; investiga mudanças que já ocorreram.</td><td>Representatividade e disponibilidade dos dados.</td><td>EC01 (IMC), EC02 (ações)</td></tr>
<tr><td>Observacional</td><td>Mínima interferência; estuda o comportamento usual.</td><td>Poucos eventos extremos (cauda); baixa variabilidade pode esconder efeitos.</td><td></td></tr>
<tr><td>Planejado</td><td>Interferência deliberada no sistema.</td><td>Exige rigor no planejamento e na análise; geralmente mais caro.</td><td>EC03 (algoritmo)</td></tr>
</tbody></table></div>

<h2>Estratégias de experimentação</h2>
<ul>
<li><strong>Adivinhação educada (educated guess):</strong> testa combinações escolhidas pela experiência de quem conduz. Pode funcionar, mas depende do experimentador.</li>
<li><strong>Um fator por vez (COST):</strong> parte de um tratamento e varia cada fator isoladamente. Funciona <em>apenas se não houver interação</em> entre fatores.</li>
<li><strong>Fatorial:</strong> avalia sistematicamente todas as combinações de níveis. Estima efeitos principais <em>e</em> efeitos de interação (aula 11).</li>
</ul>
<div class="note analogia"><span class="tag">Analogia</span>
<p>Você quer o café perfeito e muda só o açúcar (com o leite fixo), depois só o leite (com o açúcar fixo). Se a quantidade ideal de açúcar <em>depende</em> de ter leite ou não, o COST nunca vai encontrar a melhor combinação. Isso é interação.</p></div>

<h2>Planejamento de experimentos</h2>
<p><strong>Definição (slide 12):</strong> processo de planejar os protocolos de coleta de dados de modo a permitir análises acuradas com ferramentas estatísticas adequadas, possibilitando conclusões sólidas e objetivas. É necessário em sistemas sujeitos a ruído e incerteza, para que as conclusões tenham significado quantificável e para evitar vieses pessoais.</p>

<h3>Etapas do planejamento (slide 13)</h3>
<ol class="passos">
<li><div>Definição da questão, técnica ou científica, de interesse.</div></li>
<li><div>Definição dos fatores e níveis.</div></li>
<li><div>Definição do nível de confiança desejado.</div></li>
<li><div>Determinação do protocolo de coleta de dados.</div></li>
</ol>
<h3>Análise estatística das observações (slide 14)</h3>
<ol class="passos">
<li><div>Cálculo da estatística de teste.</div></li>
<li><div>Validação das premissas do modelo.</div></li>
<li><div>Cálculo da magnitude dos efeitos.</div></li>
<li><div>Elaboração de conclusões e recomendações.</div></li>
</ol>

<h3>Orientações gerais (slide 16)</h3>
<ol class="passos">
<li><div><strong>Pré-experimento:</strong> identificar e definir o problema; selecionar as variáveis experimentais e de resposta. A investigação é relevante? Como se relaciona com a literatura? A tradução <em>questão científica → hipóteses testadas</em> exige atenção especial.</div></li>
<li><div><strong>Planejamento:</strong> escolher o tipo de experimento; definir fatores e níveis; definir o nível de confiança. Envolve <em>tamanho amostral</em>, <em>ordenação das observações</em> e <em>restrições na aleatorização</em> (blocos, fatores).</div></li>
<li><div><strong>Coleta:</strong> deve seguir o plano, <strong>sem paradas prematuras</strong> e <strong>sem espiar</strong> (no-peeking), a não ser que isso esteja planejado. Um estudo piloto ajuda a obter informações preliminares e a praticar as condições experimentais.</div></li>
<li><div><strong>Análise estatística</strong>, preferencialmente com ferramentas como o R.</div></li>
<li><div><strong>Conclusões e recomendações.</strong></div></li>
</ol>

<h3>Modelagem estatística (slide 21): o teste de hipóteses em 5 passos</h3>
<ol class="passos">
<li><div>Definir a hipótese nula (ausência de efeito) e o nível de significância α.</div></li>
<li><div>Validar as premissas do teste escolhido.</div></li>
<li><div>Calcular <span class="m">P(dados | H₀ verdadeira)</span>: a probabilidade de dados tão ou mais extremos que os observados se <span class="m">H₀</span> for verdadeira (o p-valor).</div></li>
<li><div>Decidir se rejeitamos (ou não) <span class="m">H₀</span>.</div></li>
<li><div>Estimar a magnitude das diferenças, ou seja, a <strong>significância prática</strong>.</div></li>
</ol>
<p class="muted">A rejeição (ou não) de <span class="m">H₀</span> não prova nada. Ela dá uma forma objetiva de quantificar a plausibilidade de certas afirmações.</p>

<h3>Apresentar e concluir</h3>
<ul>
<li>Combine texto, números e gráficos para contar a história dos dados. Use notação coerente em figuras, tabelas e texto.</li>
<li><strong>Sempre apresente intervalos de confiança</strong> e outros indicadores do tamanho do efeito.</li>
<li>Seja conservador e não generalize demais. Relate o nível de significância e as premissas sob as quais o resultado vale.</li>
<li>Sugira explicações plausíveis e cuidado com a “busca por anomalias”.</li>
</ul>

<div class="note pegadinha"><span class="tag">Pegadinha</span>
<p>“Calcular a estatística de teste” é etapa da <strong>análise</strong>, não do planejamento. E “coletar até o p-valor cair abaixo de 0,05” é exatamente o que a regra de não espiar proíbe.</p></div>

html:`
<h2>PDF e CDF</h2>
<p>A <strong>função densidade de probabilidade</strong> (PDF) <span class="m">f(x)</span> dá a probabilidade de um intervalo pela <em>área</em> sob a curva. A <strong>função de distribuição cumulativa</strong> (CDF) acumula essa área até um ponto:</p>
<div class="formula">P(x₁ &lt; X &lt; x₂) = ∫<sub>x₁</sub><sup>x₂</sup> f(x) dx &nbsp;&nbsp;·&nbsp;&nbsp; F(x) = P(X ≤ x) = ∫<sub>−∞</sub><sup>x</sup> f(t) dt &nbsp;&nbsp;·&nbsp;&nbsp; ∫ f(x) dx = 1</div>
<div class="note analogia"><span class="tag">Analogia</span>
<p>A PDF é o relevo de um terreno: a probabilidade de cair num trecho é a área daquele pedaço. A CDF é o odômetro: quanto de área você já percorreu desde o início até o ponto x.</p></div>

<h2>As distribuições da disciplina</h2>
<div class="tw"><table class="t">
<thead><tr><th>Distribuição</th><th>Parâmetros</th><th>Ideia</th><th>Onde aparece</th></tr></thead>
<tbody>
<tr><td>Uniforme</td><td>a, b</td><td>Mesma probabilidade em [a, b]. <span class="m">μ = (a+b)/2</span>, <span class="m">σ² = (b−a)²/12</span></td><td>Tolerâncias; amostrar outras distribuições; demo do TCL (aula 03)</td></tr>
<tr><td>Normal</td><td>μ, σ²</td><td>Simétrica, em sino. Base dos ICs e testes.</td><td>IC com σ conhecido; teste z</td></tr>
<tr><td>t de Student</td><td>ν (graus de liberdade)</td><td>Parecida com a normal padrão, mas com caudas mais pesadas (mais conservadora). Tende à normal quando ν cresce.</td><td>Testes t e IC da média com σ desconhecido; regressão</td></tr>
<tr><td>χ² (qui-quadrado)</td><td>k (graus de liberdade)</td><td>Soma de k normais padrão ao quadrado. Caso particular da Gama.</td><td>IC e testes para a variância; teste de independência; estatística do Fligner-Killeen</td></tr>
<tr><td>F</td><td>d₁, d₂</td><td>Razão entre variâncias de duas populações normais.</td><td>Igualdade de variâncias; <strong>ANOVA</strong></td></tr>
</tbody></table></div>
<p class="muted">Outras citadas: Beta, Gama, Logística, Rayleigh, Gumbel, Exponencial, GEV, Lognormal, Weibull.</p>

<h2>Normal e padronização</h2>
<p>Regras empíricas: <span class="m">μ ± σ</span> contém 68,27%; <span class="m">μ ± 2σ</span> contém 95,45%; <span class="m">μ ± 3σ</span> contém 99,73%.</p>
<div class="formula">Z = (X − μ) / σ &nbsp; ~ N(0, 1), &nbsp; Φ(z) = P(Z ≤ z)</div>
<div class="note exemplo"><span class="tag">Exemplo do slide 9</span>
<p><span class="m">X ~ N(10, 4)</span>. Quanto vale <span class="m">P(X &gt; 13)</span>?</p>
<p>O segundo parâmetro é a <strong>variância</strong>: σ² = 4, logo σ = 2. Então <span class="m">z = (13 − 10)/2 = 1,5</span> e <span class="m">P(X &gt; 13) = 1 − Φ(1,5) ≈ 0,067</span> (tabela da normal padrão). No R: <code>1 - pnorm(13, mean = 10, sd = 2)</code>.</p></div>
<div class="note pegadinha"><span class="tag">Pegadinha</span>
<p>Em <span class="m">N(μ, σ²)</span> o segundo número é a variância. Dividir por 4 em vez de 2 é o erro clássico. No R, <code>pnorm</code> e <code>rnorm</code> recebem o <em>desvio-padrão</em> (<code>sd</code>), não a variância.</p></div>

<h2>Graus de liberdade</h2>
<p>Quantidade de informação disponível na amostra para estimar parâmetros desconhecidos:</p>
<div class="formula">d = n − p<small>n = número de observações · p = número de parâmetros estimados</small></div>
<p>Exemplo: a variância amostral <span class="m">s² = Σ(xᵢ − x̄)² / (n − 1)</span> usa <span class="m">n − 1</span> porque a média <span class="m">x̄</span> já foi estimada com os mesmos dados. Isso reaparece em todos os testes: <span class="m">n − 1</span> no t de uma amostra, <span class="m">n₁ + n₂ − 2</span> no t de duas amostras, <span class="m">a(n − 1)</span> no resíduo da ANOVA.</p>

<div class="note analogia"><span class="tag">Analogia</span>
<p>A t de Student é uma normal “com seguro”. Como você estimou σ a partir da própria amostra, há incerteza extra, e a t paga por isso com caudas mais grossas. Quanto mais dados, menor o seguro necessário, e a t vira a normal.</p></div>

<h3>Quem usa qual distribuição</h3>
<ul>
<li><strong>Z</strong> → IC da média com σ conhecido, ou com n grande (n &gt; 30).</li>
<li><strong>t</strong> → <code>t.test()</code> e ICs da média com σ estimado.</li>
<li><strong>χ²</strong> → IC da variância: <span class="m">(n − 1)S²/σ² ~ χ²ₙ₋₁</span>.</li>
<li><strong>F</strong> → <code>aov()</code>: <span class="m">F₀ = MS<sub>níveis</sub> / MS<sub>E</sub></span>.</li>
</ul>
`,

tldr:'Usamos uma amostra iid para estimar parâmetros da população. Um bom estimador é não tendencioso e tem variância pequena. O TCL garante que a média amostral é aproximadamente normal, mesmo quando a população não é.',
html:`
<h2>Probabilidade × Estatística</h2>
<p>O slide 4 usa uma urna de bolinhas. <strong>Probabilidade:</strong> conheço a urna; qual a chance de tirar certa combinação de cores? <strong>Estatística:</strong> vi algumas bolinhas; o que posso dizer sobre a urna? Inferência é fazer o caminho de volta, da amostra para a população.</p>

<h2>Definições</h2>
<ul>
<li><strong>População:</strong> conjunto de elementos de natureza similar que constitui o fenômeno de interesse (pode ser físico ou não).</li>
<li><strong>Amostra:</strong> subconjunto da população usado para inferir sobre ela.</li>
<li><strong>Observação:</strong> um elemento da amostra.</li>
<li><strong>Amostra aleatória:</strong> observações <strong>iid</strong>, ou seja, <em>independentes</em> (a próxima não depende das anteriores) e <em>identicamente distribuídas</em> (todas vêm da mesma distribuição).</li>
<li><strong>Estatística:</strong> qualquer número calculado a partir de uma amostra aleatória. Como cada repetição do experimento gera outra amostra, a estatística é uma variável aleatória. Sua distribuição é a <strong>distribuição amostral</strong>.</li>
</ul>

<h2>Estimador e estimativa</h2>
<p>Um <strong>estimador</strong> <span class="m">Θ̂ = h(x)</span> é uma <em>função</em> da amostra. A <strong>estimativa</strong> <span class="m">θ̂</span> é o <em>número</em> que essa função devolve para a amostra que você tem. Exemplos de parâmetros estimados: <span class="m">μ</span>, <span class="m">σ²</span>, uma proporção <span class="m">p</span>, a diferença <span class="m">μ₁ − μ₂</span>.</p>
<div class="note analogia"><span class="tag">Analogia</span>
<p>O estimador é a receita; a estimativa é o bolo que saiu hoje. A mesma receita, feita outro dia (outra amostra), dá um bolo um pouco diferente.</p></div>

<h3>Não tendencioso (não enviesado)</h3>
<div class="formula">E[Θ̂] = θ &nbsp;&nbsp;⇔&nbsp;&nbsp; T = E[Θ̂] − θ = 0<small>T é a tendência (viés) do estimador</small></div>
<p>A média amostral <span class="m">x̄</span> e a variância amostral <span class="m">s² = Σ(xᵢ − x̄)²/(n − 1)</span> são não tendenciosas. É por causa do <span class="m">n − 1</span> que <span class="m">E[s²] = σ²</span>.</p>
<p>Se houver mais de um estimador não tendencioso, escolhemos o de menor variância: o <strong>ENTVM</strong> (estimador não tendencioso de variância mínima).</p>
<div class="note analogia"><span class="tag">Analogia</span>
<p>Pense em dardos. <strong>Viés</strong> é uma mira descalibrada: os dardos se agrupam fora do centro. <strong>Variância</strong> é a mão trêmula: os dardos se espalham. O ENTVM é a mira calibrada com a mão mais firme.</p></div>

<h3>Erro padrão</h3>
<p>É o desvio-padrão do estimador, <span class="m">σ<sub>Θ̂</sub> = √Var(Θ̂)</span>. Quando calculado com dados, é o erro padrão estimado. O mais usado:</p>
<div class="formula">σ̂<sub>x̄</sub> = s / √n</div>
<p class="muted">Para outros estimadores e distribuições, o erro padrão pode vir de reamostragem (bootstrap, aula 09) ou de resultados assintóticos.</p>

<h2>Teorema Central do Limite</h2>
<p>Para uma amostra iid de uma população com média μ e variância σ² <strong>finitas</strong>, qualquer que seja a forma da distribuição:</p>
<div class="formula">Z<sub>n</sub> = (x̄ − μ) / (σ/√n) &nbsp;→&nbsp; N(0, 1) &nbsp; quando n → ∞<small>a média amostral fica aproximadamente N(μ, σ²/n)</small></div>
<p>Consequência prática: podemos usar técnicas baseadas na normal (ICs, testes t) mesmo que a população não seja normal. Para distribuições bem comportadas (contínuas, simétricas e unimodais), amostras pequenas já bastam.</p>
<div class="widget" data-widget="tcl"></div>
<div class="note pegadinha"><span class="tag">Pegadinha</span>
<p>O TCL fala da distribuição da <strong>média amostral</strong>, não dos dados. Com n grande, os dados continuam com a forma da população (uniforme, exponencial…). Quem fica normal é o histograma das médias.</p></div>
<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>No EC03 a normalidade das diferenças foi rejeitada. O relatório então usou bootstrap para ver se a <em>média</em> das diferenças tinha distribuição aproximadamente normal, que é exatamente a pergunta do TCL.</p></div>
`,

id:'intervalos', n:5, grupo:'Ferramentas estatísticas',

tldr:'Uma estimativa pontual quase nunca acerta o parâmetro exato. O intervalo de confiança mostra a estimativa junto com a sua incerteza, e é o que você deve sempre reportar.',
html:`
<h2>Por que intervalos?</h2>
<p>Cada amostra aleatória gera uma estimativa diferente. O exemplo do slide: cabos coaxiais com requisito de 50 Ω e σ conhecido de 2 Ω. Com n = 25, obteve-se <span class="m">x̄ = 48</span>. A média do processo é exatamente 48? Quase certamente não. Precisamos quantificar a incerteza.</p>

<h2>Tipos de intervalo</h2>
<div class="tw"><table class="t">
<thead><tr><th>Intervalo</th><th>Responde a</th></tr></thead>
<tbody>
<tr><td>Tolerância</td><td>Onde está uma proporção da <em>população</em>? Na engenharia é comum usar μ ± 3σ (≈ 99,7% numa normal), compensando a incerteza quando σ é estimado.</td></tr>
<tr><td>Predição</td><td>Onde deve cair uma nova observação?</td></tr>
<tr><td>Maior densidade</td><td>Região de maior densidade de probabilidade.</td></tr>
<tr><td>Confiança</td><td>Onde está o <em>parâmetro</em> (μ, σ², μ₁ − μ₂…)? É o foco da disciplina.</td></tr>
</tbody></table></div>

<h2>Intervalo de confiança</h2>
<p>Os limites <span class="m">L</span> e <span class="m">U</span> são calculados a partir da amostra, então são variáveis aleatórias. Construímos o intervalo de modo que</p>
<div class="formula">P(L ≤ μ ≤ U) = 1 − α</div>
<p>Leitura correta: o <strong>procedimento</strong> acerta em 100(1 − α)% das vezes. Se repetíssemos o experimento muitas vezes, cerca de 95% dos ICs de 95% conteriam o verdadeiro μ (ilustração do slide 8 e simulação abaixo, que reproduz o código da aula 04).</p>
<div class="widget" data-widget="ic"></div>

<h3>As fórmulas</h3>
<div class="tw"><table class="t">
<thead><tr><th>Situação</th><th>IC de 100(1 − α)% para μ</th></tr></thead>
<tbody>
<tr><td>População normal, σ conhecido</td><td><span class="m">x̄ ± z<sub>α/2</sub> · σ/√n</span></td></tr>
<tr><td>População normal, σ desconhecido</td><td><span class="m">x̄ ± t<sub>α/2, n−1</sub> · s/√n</span></td></tr>
<tr><td>Amostra grande (n &gt; 30)</td><td>Pelo TCL, pode-se usar <span class="m">z<sub>α/2</sub></span> no lugar de <span class="m">t</span></td></tr>
<tr><td>Unilateral</td><td><span class="m">[x̄ − t<sub>α, n−1</sub> s/√n; ∞)</span> ou <span class="m">(−∞; x̄ + t<sub>α, n−1</sub> s/√n]</span></td></tr>
<tr><td>Variância σ² (pop. normal)</td><td><span class="m">[(n−1)s² / χ²<sub>sup</sub> ; (n−1)s² / χ²<sub>inf</sub>]</span>, com quantis da χ² de n − 1 gl</td></tr>
</tbody></table></div>

<div class="note exemplo"><span class="tag">Exemplo do slide 12</span>
<p>Cabos: <span class="m">x̄ = 48</span>, σ = 2, n = 25, α = 0,05.</p>
<p><span class="m">48 ± 1,96 × 2/√25 = 48 ± 0,784</span> → <strong>IC95%(μ) = [47,22; 48,78]</strong>.</p>
<p>O requisito de 50 Ω está fora do intervalo. Isso é evidência de que a impedância média do processo está abaixo do requisito.</p></div>

<h3>O que muda a largura do IC</h3>
<ul>
<li><strong>n maior → IC mais estreito</strong>, na proporção de 1/√n. Quadruplicar n corta a largura pela metade.</li>
<li><strong>Confiança maior → IC mais largo</strong> (z ou t maiores).</li>
<li><strong>σ maior → IC mais largo.</strong></li>
</ul>

<div class="note analogia"><span class="tag">Analogia</span>
<p>A estimativa pontual é um arpão: quase sempre erra o peixe por pouco. O IC é uma rede. Uma rede de 95% é construída de modo que, em 95% dos lançamentos, o peixe fica dentro. Rede maior (99%) pega mais vezes, mas diz menos sobre onde exatamente o peixe está.</p></div>

<div class="note pegadinha"><span class="tag">Pegadinha</span>
<p>IC de confiança ≠ intervalo de tolerância. O IC fala do <strong>parâmetro</strong> (μ). “95% dos dados estão entre 47,22 e 48,78” está errado: isso seria um intervalo de tolerância, e seria muito mais largo.</p></div>

<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>Todos os relatórios reportam IC 95% da diferença. No EC01 (homens), o IC <span class="m">[−1,78; 3,09]</span> contém o zero, o que é coerente com <span class="m">p = 0,59</span>: não se rejeitou <span class="m">H₀</span>. Apresentar o IC é sempre melhor que só a estimativa pontual (slide 20).</p></div>
`,

/* ===================================================== FASE 6 */
{
id:'inferencia', n:6, grupo:'Testes de hipóteses',
titulo:'Inferência Estatística e Testes de Hipóteses',
aula:'Aula 05', slides:'codigos/05-inferencia_estatistica (o PDF desta aula não está na pasta Slides) + revisão nos slides 02, 06 e 09',
tldr:'Um teste de hipóteses mede quão surpreendentes os dados seriam se não houvesse efeito. α controla o falso positivo, β o falso negativo, e o poder (1 − β) é o que o tamanho amostral garante.',
html:`
<div class="note"><span class="tag">Sobre esta fase</span>
<p>O PDF da aula de Inferência Estatística não está na pasta <code>Slides/</code>. Esta fase foi montada com o script <code>05_inferencia_estatistica.R</code> e com as revisões de testes de hipóteses dos slides 02 (p. 21), 06 e 09 (p. 4–6).</p></div>

<h2>As duas hipóteses</h2>
<p><span class="m">H₀</span> é a hipótese <strong>conservadora</strong>: não há novidade (a especificação é atendida, o novo processo não difere do antigo). <span class="m">H₁</span> representa a novidade:</p>
<ul>
<li><strong>Bilateral</strong> (<span class="m">θ ≠ θ₀</span>): interessa qualquer diferença.</li>
<li><strong>Unilateral</strong> (<span class="m">θ &lt; θ₀</span> ou <span class="m">θ &gt; θ₀</span>): só interessa uma direção, por exemplo “o novo método reduz o erro”.</li>
</ul>
<p>A direção é escolhida <strong>antes</strong> de ver os dados, a partir da pergunta técnica. O EC01 usou bilateral porque não havia razão teórica para esperar uma direção.</p>

<h2>Estatística de teste e p-valor</h2>
<p>Para a média de uma população normal com σ desconhecido:</p>
<div class="formula">t₀ = (x̄ − μ₀) / (s / √n) &nbsp; ~ &nbsp; t<sub>n−1</sub> &nbsp; sob H₀</div>
<p>O <strong>p-valor</strong> é a probabilidade de observar uma estatística tão ou mais extrema que a obtida, <strong>supondo <span class="m">H₀</span> verdadeira</strong>. Fixado α, rejeitamos <span class="m">H₀</span> se <span class="m">p ≤ α</span>.</p>
<pre class="r"><span class="c"># codigos/05: média de uma população normal, variância desconhecida</span>
t.test(my.sample, alternative = "less", mu = 50, conf.level = 0.99)  <span class="c"># unilateral</span>
t.test(my.sample, mu = 50, conf.level = 0.99)                        <span class="c"># bilateral</span></pre>

<h2>Os dois erros</h2>
<div class="tw"><table class="t">
<thead><tr><th></th><th>H₀ verdadeira</th><th>H₀ falsa</th></tr></thead>
<tbody>
<tr><td>Rejeito H₀</td><td>Erro tipo I (falso positivo). Probabilidade α</td><td>Acerto. Probabilidade 1 − β = <strong>poder</strong></td></tr>
<tr><td>Não rejeito H₀</td><td>Acerto. Probabilidade 1 − α</td><td>Erro tipo II (falso negativo). Probabilidade β</td></tr>
</tbody></table></div>
<div class="note analogia"><span class="tag">Analogia</span>
<p>Um tribunal. <span class="m">H₀</span> é “o réu é inocente”. Erro tipo I é condenar um inocente; erro tipo II é absolver um culpado. O poder é a capacidade de condenar quem é de fato culpado. E “não culpado” não é a mesma coisa que “inocente”: só não houve provas suficientes.</p></div>

<h2>Poder e tamanho amostral</h2>
<p>O poder depende de quatro coisas. Fixando três, a quarta fica determinada:</p>
<ul>
<li><strong>δ*</strong>: efeito minimamente relevante (a menor diferença que importa na prática). Normalizado: <span class="m">d* = δ*/σ</span>;</li>
<li><strong>σ</strong>: variabilidade (estimada por histórico, conhecimento do processo ou piloto);</li>
<li><strong>α</strong>: nível de significância;</li>
<li><strong>n</strong>: tamanho amostral.</li>
</ul>
<pre class="r"><span class="c"># codigos/05: poder com n = 10</span>
power.t.test(n = 10, delta = 0.5, sd = 1, sig.level = 0.01,
             type = "one.sample", alternative = "one.sided")
<span class="c"># menor delta detectável com n = 10 e poder 0,85</span>
power.t.test(power = 0.85, n = 10, sd = 1, sig.level = 0.01,
             type = "one.sample", alternative = "one.sided")</pre>
<p>Deixe de fora exatamente o argumento que você quer descobrir: <code>n</code>, <code>delta</code> ou <code>power</code>.</p>
<div class="widget" data-widget="poder"></div>

<h2>Premissas do teste t</h2>
<ul>
<li><strong>Normalidade:</strong> QQ-plot (<code>car::qqPlot</code>) e Shapiro-Wilk (<code>shapiro.test</code>; <span class="m">H₀</span> = os dados são normais). O teste t é robusto a violações leves ou moderadas.</li>
<li><strong>Independência:</strong> garantida no planejamento. O Durbin-Watson (<code>car::durbinWatsonTest(lm(x ~ 1))</code>) só detecta autocorrelação serial na ordem em que os dados estão.</li>
</ul>

<h2>Teste e IC andam juntos</h2>
<p>Um teste bilateral com nível α rejeita <span class="m">H₀: μ = μ₀</span> exatamente quando <span class="m">μ₀</span> fica fora do IC de 100(1 − α)%. Por isso os relatórios dizem “o IC contém o zero e p &gt; α”.</p>

<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li><strong>p-valor não é P(H₀ verdadeira).</strong> É P(dados tão extremos | H₀).</li>
<li><strong>Não rejeitar H₀ não prova H₀.</strong> Pode ser falta de poder (erro tipo II). Para afirmar igualdade é preciso um teste de equivalência (aula 07).</li>
<li><strong>Significância estatística ≠ relevância prática.</strong> Com n enorme, diferenças irrelevantes ficam significativas. Compare o IC com δ*.</li>
<li>No Shapiro-Wilk, p &gt; α é a resposta “boa”: não há evidência contra a normalidade.</li>
</ul></div>

<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>EC01: p = 0,086 nas mulheres → não se rejeitou <span class="m">H₀</span>, e o relatório discutiu o poder (amostras de 7 e 4 alunas). EC03: o planejamento fixou α = 0,05, poder 0,8 e d* = 0,5, e daí saiu N = 34 instâncias com <code>power.t.test(type = "paired")</code>.</p></div>
`,
quiz:[
{q:'Um teste retornou p = 0,03 com α = 0,05. Qual leitura é correta?', o:['Se H₀ fosse verdadeira, dados tão ou mais extremos teriam 3% de probabilidade; rejeita-se H₀','A probabilidade de H₀ ser verdadeira é 3%','Há 97% de probabilidade de H₁ ser verdadeira','O efeito é grande e relevante na prática'], c:0, e:'O p-valor é condicional a H₀. Ele não dá a probabilidade de H₀ nem mede o tamanho do efeito.'},
{q:'O erro tipo II consiste em:', o:['Não rejeitar H₀ quando ela é falsa','Rejeitar H₀ quando ela é verdadeira','Escolher α grande demais','Usar teste bilateral quando deveria ser unilateral'], c:0, e:'Tipo II = falso negativo, com probabilidade β. Tipo I = falso positivo, com probabilidade α.'},
{q:'O poder de um teste é:', o:['A probabilidade de rejeitar H₀ quando existe um efeito real de tamanho δ*','A probabilidade de não rejeitar H₀ quando ela é verdadeira','O próprio p-valor','A probabilidade de erro tipo I'], c:0, e:'Poder = 1 − β, sempre calculado para um tamanho de efeito específico.'},
{q:'Mantendo α e δ* fixos, qual ação aumenta o poder?', o:['Aumentar o tamanho amostral','Diminuir α','Aumentar a variabilidade do processo','Trocar um teste unilateral bem justificado por bilateral'], c:0, e:'Mais dados reduzem o erro padrão (s/√n). Diminuir α, aumentar σ ou usar bilateral reduzem o poder.'},
{q:'Um teste comparando dois processos não rejeitou H₀ (p = 0,40). O que se pode afirmar?', o:['Não há evidência suficiente de diferença; isso não prova que os processos são iguais','Os processos são equivalentes','H₁ é falsa','O teste foi mal feito porque não deu significativo'], c:0, e:'Ausência de evidência não é evidência de ausência. Pode faltar poder. Para afirmar igualdade, use um teste de equivalência.'},
{q:'Quando é legítimo usar um teste unilateral?', o:['Quando a pergunta técnica, definida antes da coleta, só se interessa por uma direção','Quando os dados já mostram a direção do efeito','Sempre que o bilateral não der significativo','Quando a amostra é pequena'], c:0, e:'Escolher a direção depois de ver os dados é uma forma de HARKing e infla o erro tipo I.'},
{q:'Como a premissa de independência é garantida?', o:['Principalmente pelo planejamento e protocolo de coleta; o Durbin-Watson só detecta autocorrelação serial','Pelo teste de Shapiro-Wilk','Pelo teste de Fligner-Killeen','Aumentando o tamanho amostral'], c:0, e:'Slide 06, p. 19: não existe teste para garantir independência; isso deve ser assegurado no planejamento.'}
]
},

/* ===================================================== FASE 7 */
{
id:'comparacoes', n:7, grupo:'Testes de hipóteses',
titulo:'Comparações Simples e Pareadas',
aula:'Aula 06', slides:'06_Comparacao_Simples_Pareada.pdf · codigos/06-comparacoes',
tldr:'Para comparar duas médias, use o teste t de duas amostras (variâncias iguais ou Welch). Quando cada unidade passa pelos dois tratamentos, pareie: a diferença dentro da unidade elimina o efeito da unidade e o teste ganha muito poder.',
html:`
<h2>Comparação simples: duas amostras independentes</h2>
<div class="note exemplo"><span class="tag">Exemplo do slide: hastes de aço</span>
<p>Um engenheiro quer saber se um novo método de corte reduz o erro de comprimento. Resposta: erro absoluto <span class="m">y = |l − l<sub>nominal</sub>|</span>. Modelo: <span class="m">y<sub>ij</sub> = μ<sub>i</sub> + ε<sub>ij</sub></span>, com <span class="m">i</span> = processo.</p>
<div class="formula">H₀: μ<sub>novo</sub> − μ<sub>atual</sub> = 0 &nbsp;&nbsp; H₁: μ<sub>novo</sub> − μ<sub>atual</sub> &lt; 0<small>α = 0,05 · poder 0,8 · δ* = 15 cm · σ ≈ 15 cm (manuais + histórico)</small></div></div>

<h3>Planejar: tamanho amostral</h3>
<p>Com variâncias aproximadamente iguais, o tamanho ótimo é <span class="m">n₁ = n₂ = n</span>:</p>
<div class="formula">n ≈ 2 · ( (t<sub>α, 2n−2</sub> + t<sub>β, 2n−2</sub>) / d* )², &nbsp; d* = δ*/σ<small>a equação depende de n dos dois lados: comece com z no lugar de t e itere</small></div>
<p>O problema do ovo e da galinha: para calcular n precisamos de σ, e para estimar σ precisamos de dados. Saídas: conhecimento do processo ou dados históricos, usar o efeito normalizado d*, ou fazer um <strong>estudo piloto</strong>.</p>
<pre class="r">power.t.test(delta = 15, sd = 15, sig.level = 0.05, power = 0.8,
             type = "two.sample", alternative = "one.sided")
<span class="c">#  n = 13.09777   NOTE: n is number in *each* group</span></pre>
<p>Arredonde <strong>para cima</strong>: 14 hastes por grupo.</p>

<h3>Analisar: variâncias iguais</h3>
<div class="formula">S<sub>p</sub>² = [(n₁−1)S₁² + (n₂−1)S₂²] / (n₁ + n₂ − 2) &nbsp;&nbsp; t₀ = (ȳ₁ − ȳ₂) / (S<sub>p</sub> √(1/n₁ + 1/n₂)) ~ t<sub>n₁+n₂−2</sub></div>
<pre class="r">t.test(y$Length.error ~ y$Process, alternative = "less", mu = 0,
       var.equal = TRUE, conf.level = 0.95)
<span class="c"># t = -14.312, df = 32, p-value = 9.244e-16</span>
<span class="c"># 95% CI: -Inf  -7.156884 ;  médias: new 7.78  old 15.90</span></pre>
<p>Premissas verificadas no slide:</p>
<ul>
<li><strong>Normalidade:</strong> Shapiro p = 0,164 (novo) e 0,452 (atual). O teste t é robusto a violações leves e moderadas.</li>
<li><strong>Igualdade de variâncias:</strong> Fligner-Killeen p = 0,149, mais o gráfico dos resíduos por grupo.</li>
<li><strong>Independência:</strong> garantida no planejamento; Durbin-Watson só para tendência na ordem de coleta.</li>
</ul>

<h3>Variâncias diferentes: Welch</h3>
<div class="formula">t₀* = (ȳ₁ − ȳ₂) / √(s₁²/n₁ + s₂²/n₂) &nbsp; ≈ t<sub>ν</sub><small>ν pela fórmula de Welch-Satterthwaite</small></div>
<p>O Welch costuma ser a primeira escolha porque remove uma premissa. O preço é um pouco menos de poder. No caso desbalanceado, a alocação ótima segue os desvios-padrão: <span class="m">n₁/n₂ = σ₁/σ₂</span>. No R, é o padrão do <code>t.test</code> (<code>var.equal = FALSE</code>).</p>

<h2>Comparação pareada</h2>
<div class="note exemplo"><span class="tag">Exemplo do slide: algoritmos A × B</span>
<p>Um pesquisador compara o tempo de convergência de um algoritmo novo (A) com o estado da arte (B) em N = 7 instâncias de benchmark, com 30 repetições por instância. Interessa detectar diferenças maiores que δ* = 10 s, com poder 0,8 e α = 0,05.</p></div>
<p>A variabilidade entre instâncias é enorme e controlável. A saída elegante é <strong>parear</strong>: comparar A e B dentro de cada instância.</p>
<div class="formula">y<sub>ij</sub> = μ + τ<sub>i</sub> + β<sub>j</sub> + ε<sub>ij</sub> &nbsp;⇒&nbsp; d<sub>j</sub> = y<sub>Aj</sub> − y<sub>Bj</sub> = (τ<sub>A</sub> − τ<sub>B</sub>) + ε<sub>j</sub> = μ<sub>D</sub> + ε<sub>j</sub><small>o efeito da instância β<sub>j</sub> se cancela na subtração</small></div>
<div class="formula">H₀: μ<sub>D</sub> = 0 &nbsp; H₁: μ<sub>D</sub> ≠ 0 &nbsp;&nbsp;·&nbsp;&nbsp; t₀ = D̄ / (S<sub>D</sub>/√N) ~ t<sub>N−1</sub></div>
<pre class="r"><span class="c"># 1) agregar: média das 30 repetições por instância e algoritmo</span>
aggdata &lt;- aggregate(Time ~ Problem:Algorithm, data = data, FUN = mean)
<span class="c"># 2) teste pareado</span>
t.test(Time ~ Algorithm, paired = TRUE, data = aggdata)
<span class="c"># t = -9.1585, df = 6, p-value = 9.54e-05</span>
<span class="c"># 95% CI: -21.85862 -12.64118 ; mean of the differences -17.2499</span></pre>
<p>Shapiro das diferenças: p = 0,097. Há um ponto atípico; refazendo sem ele, p = 6,2 × 10⁻⁶ e IC [−21,4; −16,5]. A conclusão se mantém.</p>

<h3>O que acontece se ignorar o pareamento</h3>
<div class="tw"><table class="t num">
<thead><tr><th>Análise dos mesmos dados</th><th>p-valor</th><th>IC 95% da diferença</th></tr></thead>
<tbody>
<tr><td>t pareado</td><td>9,5 × 10⁻⁵</td><td>[−21,9; −12,6]</td></tr>
<tr><td>Welch (ignorando instâncias)</td><td>0,72</td><td>[−121,4; 86,9]</td></tr>
</tbody></table></div>
<p>Sem pareamento, a variação entre instâncias vai para o resíduo e afoga o efeito dos algoritmos.</p>

<h3>Cuidados no pareado (slide 28)</h3>
<ul>
<li>δ* se refere ao ganho médio <strong>na classe de problemas</strong>, não a uma instância isolada.</li>
<li>O tamanho amostral que importa é o <strong>número de instâncias</strong>, não o de repetições.</li>
<li>As repetições reduzem a incerteza de cada observação (média por instância), e essa incerteza se propaga para a variância residual.</li>
<li>O pareamento é indicado quando há grande correlação entre as observações, ou seja, condições experimentais heterogêneas.</li>
</ul>

<div class="note analogia"><span class="tag">Analogia</span>
<p>Para comparar dois tênis de corrida, você pode dar o tênis A a um grupo e o B a outro grupo. Mas os corredores são muito diferentes entre si. Melhor: cada corredor corre com os dois (em ordem sorteada). Cada pessoa vira o próprio controle e a diferença de condicionamento físico desaparece da comparação.</p></div>

<h2>Comparações múltiplas (prévia)</h2>
<p>Com três ou mais grupos, fazer vários testes t aos pares exige correção do α (Bonferroni) ou testes específicos (Tukey). Isso é tratado na ANOVA (fase 9).</p>

<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li><code>power.t.test</code> devolve n <strong>por grupo</strong>. E arredonda-se para cima.</li>
<li>No pareado, os graus de liberdade são N − 1 com N = número de pares (instâncias), não o número total de execuções.</li>
<li>Tratar as 30 repetições como observações independentes é <strong>pseudorreplicação</strong>.</li>
</ul></div>

<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p><strong>EC01</strong> é a comparação simples: dois semestres independentes, Fligner sem evidência contra variâncias iguais, <code>t.test(var.equal = TRUE)</code>. As alunas tinham amostras desbalanceadas (7 e 4), e o poder foi calculado com <code>pwr.t2n.test</code>. <strong>EC03</strong> é a pareada: as duas configurações nas mesmas instâncias, N = 34 instâncias, média das repetições por instância.</p></div>
`,
quiz:[
{q:'Nas hastes de aço, o Fligner-Killeen deu p = 0,149 (α = 0,05). O que isso indica?', o:['Não há evidência contra a igualdade das variâncias; a homoscedasticidade é plausível','As variâncias são diferentes e é obrigatório usar Welch','Os dados são normais','Deve-se rejeitar H₀ do teste t'], c:0, e:'No Fligner, H₀ é a igualdade de variâncias. p > α significa não rejeitar H₀.'},
{q:'Por que o teste de Welch costuma ser uma das primeiras escolhas?', o:['Porque dispensa a premissa de variâncias iguais, ao custo de um pouco menos de poder','Porque dispensa a premissa de normalidade','Porque tem mais poder que o t com variâncias iguais','Porque funciona com dados pareados'], c:0, e:'Slide 22: retirar uma premissa reduz o poder do teste.'},
{q:'No exemplo dos algoritmos (7 instâncias, 30 repetições cada), quantos graus de liberdade tem o teste t pareado?', o:['6','209','29','12'], c:0, e:'Os pares são as instâncias: N − 1 = 7 − 1 = 6. As repetições viram uma média por instância.'},
{q:'Com os mesmos dados, o t pareado deu p = 9,5 × 10⁻⁵ e o Welch deu p = 0,72. Por quê?', o:['A grande variabilidade entre instâncias entra no resíduo do teste não pareado e mascara o efeito dos algoritmos','O Welch é um teste com erro','O pareado infla o erro tipo I','Os dados deixaram de ser normais'], c:0, e:'O pareamento remove o efeito β_j da instância. Sem ele, essa variação vai para o erro.'},
{q:'Em comparações pareadas de algoritmos, o tamanho amostral mais importante é:', o:['O número de instâncias','O número de repetições por instância','O número de execuções no total','O número de algoritmos'], c:0, e:'Slide 28: a inferência é sobre a classe de problemas, representada pelas instâncias.'},
{q:'power.t.test(delta = 15, sd = 15, power = 0.8, ...) retornou n = 13,1. Quantas hastes coletar?', o:['14 em cada grupo','13 no total','13 em cada grupo','27 no total'], c:0, e:'O n é por grupo e deve ser arredondado para cima: 14 + 14 = 28 hastes.'},
{q:'Com variâncias diferentes e σ₁ = 2σ₂, qual alocação é ótima no caso desbalanceado?', o:['n₁ = 2 n₂','n₁ = n₂','n₂ = 2 n₁','n₁ = 4 n₂'], c:0, e:'Slide 22: n₁/n₂ = σ₁/σ₂.'}
]
}
);

{
id:'equivalencia', n:8, grupo:'Testes de hipóteses',
titulo:'Equivalência e Não Inferioridade',
aula:'Aula 07', slides:'07_Equivalencia_Nao_Inferioridade.pdf · codigos/07-equivalencia',
tldr:'Quando a novidade que você quer demonstrar é a igualdade, inverta as hipóteses: H₀ passa a ser “há diferença relevante”. A equivalência é demonstrada com dois testes unilaterais (TOST), ou com um IC de nível 1 − 2α contido em ±δ*.',
html:`
<h2>Por que inverter?</h2>
<p>No teste usual, <span class="m">H₁</span> (a decisão forte) é a diferença. Mas em certificação industrial ou em equivalência de medicamentos, a novidade que se quer provar é a <strong>igualdade aproximada</strong>. Como não rejeitar <span class="m">H₀</span> não prova nada, é preciso colocar a igualdade em <span class="m">H₁</span>.</p>
<p>“Equivalente” não significa idêntico. Significa que a diferença está dentro de uma <strong>margem de equivalência δ*</strong> (o limite de significância prática).</p>

<h2>Teste de equivalência (TOST)</h2>
<div class="formula">H₀: |μ₁ − μ₂| ≥ δ* &nbsp;&nbsp; H₁: |μ₁ − μ₂| &lt; δ*</div>
<p>Testado com <strong>dois testes unilaterais</strong>, cada um com nível α:</p>
<div class="formula">H₀₁: μ₁ − μ₂ = −δ* &nbsp;vs&nbsp; H₁₁: μ₁ − μ₂ &gt; −δ* &nbsp;&nbsp;·&nbsp;&nbsp; H₀₂: μ₁ − μ₂ = δ* &nbsp;vs&nbsp; H₁₂: μ₁ − μ₂ &lt; δ*</div>
<p>Só se declara equivalência se <strong>as duas</strong> <span class="m">H₀</span> forem rejeitadas.</p>
<p><strong>Atalho pelo IC:</strong> há equivalência ao nível α se o <strong>IC de 100(1 − 2α)%</strong> da diferença estiver inteiramente dentro de <span class="m">(−δ*, δ*)</span>.</p>

<h2>Não inferioridade</h2>
<p>Versão unilateral: declarar que um processo novo <em>não é pior</em> que o padrão, ou seja, que ele é no máximo δ* pior. É um único teste unilateral com a margem δ* embutida na <span class="m">H₀</span>.</p>

<div class="note exemplo"><span class="tag">Exemplo do slide: laboratório balístico</span>
<p>Um laboratório precisa mostrar que a área média do furo do seu procedimento equivale à do equipamento de referência, com tolerância de δ* = 4 mm². Estimativas: σ<sub>Lab</sub> = 5, σ<sub>Ref</sub> = 10 mm². Erros: α = 0,01 e β = 0,1.</p>
<p><strong>Planejamento:</strong> com Δμ* = 0,5 (fórmula de Zhang, <code>calcN_tost2</code>), n = 144,2 → <strong>145 observações por grupo</strong>.</p>
<pre class="r">t.test(HoleArea ~ Place, data = data, alternative = "less",    mu =  4, conf.level = 0.99)$p.value
<span class="c"># 0.00304</span>
t.test(HoleArea ~ Place, data = data, alternative = "greater", mu = -4, conf.level = 0.99)$p.value
<span class="c"># 6.59e-10</span>
t.test(HoleArea ~ Place, data = data, conf.level = 0.98)$conf.int
<span class="c"># -0.5117627  3.6244386</span></pre>
<p>Os dois p-valores estão abaixo de 0,01 e o IC de 98% (= 1 − 2 × 0,01) está dentro de (−4, 4). <strong>Equivalência demonstrada.</strong> Premissas: QQ-plots por grupo e Durbin-Watson (DW = 1,81; p = 0,048), com gráfico das observações pela ordem de coleta.</p></div>

<h3>Tamanho amostral</h3>
<div class="formula">uma amostra: n ≥ ( (t<sub>α</sub> + t<sub>β</sub>) σ̂ / (δ* − Δμ) )²<small>duas amostras: fórmula de Zhang, com graus de liberdade de Welch; iterar começando com z</small></div>

<div class="note analogia"><span class="tag">Analogia</span>
<p>Uma peça nova precisa encaixar no lugar da antiga com folga máxima de 4 mm. Dizer “não consegui medir diferença” não serve, porque talvez a régua seja ruim. Você precisa mostrar, com confiança, que a diferença inteira cabe na folga. Isso é o IC dentro de ±δ*.</p></div>

<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li>IC de nível <strong>1 − 2α</strong> (98% para α = 0,01; 90% para α = 0,05), não 1 − α.</li>
<li>Precisa rejeitar <strong>as duas</strong> hipóteses nulas.</li>
<li>Um p-valor alto num teste de diferença <strong>não</strong> demonstra equivalência.</li>
</ul></div>
<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>No EC02, o Dunnett não distinguiu V3 de V1. O relatório tomou o cuidado de escrever que isso <em>não prova que as médias são iguais</em>, apenas que não há evidência de diferença. Para afirmar igualdade, seria preciso um teste de equivalência com δ* definido antes.</p></div>
`,
quiz:[

{q:'Com α = 0,05, qual IC deve estar contido em (−δ*, δ*) para declarar equivalência?', o:['IC de 90%','IC de 95%','IC de 97,5%','IC de 99%'], c:0, e:'Nível 1 − 2α = 0,90, porque são dois testes unilaterais com α cada.'},
{q:'No laboratório balístico, IC98% = [−0,51; 3,62] e δ* = 4 mm². A conclusão é:', o:['Há equivalência, pois o IC está inteiramente dentro de (−4, 4)','Não há equivalência, pois o IC não contém o zero','Não há equivalência, pois 3,62 é próximo de 4','Nada se conclui sem o teste de Shapiro'], c:0, e:'Para equivalência basta o IC (1 − 2α) caber na margem; ele pode conter ou não o zero.'},
{q:'Um teste t comparando um método novo e um antigo deu p = 0,40. Isso permite afirmar que são equivalentes?', o:['Não; ausência de evidência de diferença não demonstra equivalência','Sim, pois p > 0,05','Sim, se o poder for maior que 0,8','Sim, desde que as variâncias sejam iguais'], c:0, e:'É preciso definir δ* e testar a equivalência diretamente (TOST ou IC 1 − 2α).'},
{q:'O teste de não inferioridade serve para mostrar que:', o:['Um processo novo não é pior que o padrão por mais que δ*','Um processo novo é estritamente melhor que o padrão','Dois processos são idênticos','As variâncias de dois processos são iguais'], c:0, e:'É a versão unilateral da equivalência, com a margem δ* incluída na H₀.'}
]

/* ===================================================== FASE 9 */
{
id:'anova', n:9, grupo:'Mais de dois grupos',
titulo:'Análise de Variância (ANOVA)',
aula:'Aula 08', slides:'08_ANOVA.pdf · codigos/08-anova',
tldr:'A ANOVA testa se pelo menos uma de várias médias difere, comparando a variação entre grupos com a variação dentro dos grupos (F = MS_níveis / MS_E). Se rejeitar, use comparações múltiplas (Tukey ou Dunnett) para saber quais diferem.',
html:`
<div class="note exemplo"><span class="tag">Exemplo do slide: resistência do papel</span>
<p>Um engenheiro investiga se o tipo de fibra (A, B, C, D) afeta a resistência à tração do papel. Orçamento: 6 ciclos de produção por fibra. Portanto, um fator com <span class="m">a = 4</span> níveis e <span class="m">n = 6</span> repetições. δ* = 5 kPa, σ̂ = 6 kPa, α = 0,1, β = 0,2.</p>
<p>O boxplot mostra diferenças entre fibras, variabilidade diferente por nível, assimetria em B e um possível outlier em C. Isso precisa ser ponderado na análise.</p></div>

<h2>Por que não vários testes t?</h2>
<p>Cada teste tem chance α de falso positivo. Usar o mesmo conjunto de dados para muitos testes aumenta a chance de pelo menos um falso positivo (erro tipo I da família). A ANOVA faz um único teste global.</p>

<h2>Modelo</h2>
<div class="formula">y<sub>ij</sub> = μ<sub>i</sub> + ε<sub>ij</sub> = μ + τ<sub>i</sub> + ε<sub>ij</sub>, &nbsp; Σ τ<sub>i</sub> = 0, &nbsp; ε<sub>ij</sub> ~ iid N(0, σ²)<small>modelo das médias = modelo dos efeitos · i = 1…a níveis · j = 1…n repetições</small></div>
<div class="formula">H₀: τ<sub>i</sub> = 0 ∀ i &nbsp;&nbsp; H₁: ∃ τ<sub>i</sub> ≠ 0</div>
<ul>
<li><strong>CRD</strong> (experimento completamente aleatorizado): observações em ordem aleatória, condições constantes.</li>
<li><strong>Efeitos fixos:</strong> os níveis foram escolhidos pelo experimentador. Os resultados <em>não</em> podem ser extrapolados para níveis não testados.</li>
</ul>

<h2>Decompondo a variabilidade</h2>
<div class="formula">SS<sub>T</sub> = Σ Σ (y<sub>ij</sub> − ȳ··)² = n Σ (ȳ<sub>i·</sub> − ȳ··)² + Σ Σ (y<sub>ij</sub> − ȳ<sub>i·</sub>)² = SS<sub>níveis</sub> + SS<sub>E</sub></div>
<div class="tw"><table class="t">
<thead><tr><th>Fonte</th><th>gl</th><th>Quadrado médio</th><th>Valor esperado</th></tr></thead>
<tbody>
<tr><td>Níveis (entre)</td><td>a − 1</td><td>MS<sub>níveis</sub> = SS<sub>níveis</sub>/(a − 1)</td><td>σ² + n Σ τ<sub>i</sub>² / (a − 1)</td></tr>
<tr><td>Erro (dentro)</td><td>a(n − 1)</td><td>MS<sub>E</sub> = SS<sub>E</sub>/(a(n − 1))</td><td>σ²</td></tr>
</tbody></table></div>
<p>Sob <span class="m">H₀</span> os dois quadrados médios estimam σ². Se há efeito, <span class="m">MS<sub>níveis</sub></span> fica maior:</p>
<div class="formula">F₀ = MS<sub>níveis</sub> / MS<sub>E</sub> &nbsp;~&nbsp; F<sub>(a−1), a(n−1)</sub> sob H₀ &nbsp;·&nbsp; rejeita se f₀ &gt; F<sub>1−α</sub></div>
<div class="widget" data-widget="anova"></div>

<div class="note analogia"><span class="tag">Analogia</span>
<p>Uma festa com várias mesas. Se a conversa <em>entre</em> as mesas (cada mesa falando de um assunto diferente) é muito mais alta que o burburinho <em>dentro</em> de cada mesa, as mesas são de fato diferentes. F é essa razão sinal/ruído.</p></div>

<h2>No R</h2>
<pre class="r">my.model &lt;- aov(TS.kPa ~ Fiber.type, data = paper)
summary.aov(my.model)
<span class="c">#             Df Sum Sq Mean Sq F value   Pr(>F)</span>
<span class="c"># Fiber.type   3 110.77   36.92   13.62 4.56e-05 ***</span>
<span class="c"># Residuals   20  54.24    2.71</span></pre>
<p>gl: <span class="m">a − 1 = 3</span> e <span class="m">a(n − 1) = 4 × 5 = 20</span>. <span class="m">F = 36,92/2,71 ≈ 13,6</span>. Com p = 4,56 × 10⁻⁵, rejeita-se <span class="m">H₀</span>: <strong>existe ao menos uma fibra com efeito diferente de zero</strong>. Ainda falta responder: as premissas valem? Quais fibras diferem, e quanto?</p>

<h2>Premissas (nos resíduos)</h2>
<p>Resíduo: <span class="m">ε̂<sub>ij</sub> = y<sub>ij</sub> − ȳ<sub>i·</sub></span>, no R <code>my.model$residuals</code>.</p>
<div class="tw"><table class="t">
<thead><tr><th>Premissa</th><th>Como verificar</th><th>Resultado no papel</th></tr></thead>
<tbody>
<tr><td>Normalidade</td><td><code>shapiro.test(my.model$residuals)</code> + <code>qqPlot</code></td><td>W = 0,972; p = 0,72. ANOVA é robusta a violações moderadas.</td></tr>
<tr><td>Homoscedasticidade</td><td><code>fligner.test(TS.kPa ~ Fiber.type)</code> + resíduos × ajustados</td><td>p = 0,79. Robusta a violações modestas se balanceado.</td></tr>
<tr><td>Independência</td><td>Planejamento: sem pseudorreplicação, ordem aleatória. DW se houver ordem de coleta.</td><td>A ANOVA é sensível a violações desta premissa.</td></tr>
</tbody></table></div>

<h2>Comparações múltiplas</h2>
<p>Planeje as comparações <strong>antes</strong> do experimento, guiado pela pergunta técnica. Hipóteses criadas depois de ver os dados (post-hoc, HARKing) são fonte comum de viés. Quanto menos comparações, mais poder.</p>
<div class="tw"><table class="t">
<thead><tr><th>Pergunta</th><th>Método</th><th>Nº de comparações K</th></tr></thead>
<tbody>
<tr><td>Quais níveis diferem entre si?</td><td>Tukey (HSD): todos contra todos</td><td>a(a − 1)/2</td></tr>
<tr><td>Algum nível difere do controle/padrão?</td><td>Dunnett: todos contra um</td><td>a − 1</td></tr>
<tr><td>Correção genérica</td><td>Bonferroni: α<sub>aj</sub> = α/K (conservador)</td><td>K</td></tr>
</tbody></table></div>
<pre class="r">library(multcomp)
mc1 &lt;- glht(my.model, linfct = mcp(Fiber.type = "Tukey"))
confint(mc1, level = 0.95)
<span class="c">#            Estimate     lwr    upr</span>
<span class="c"># B - A == 0  -1.9867 -4.6478 0.6745</span>
<span class="c"># C - A == 0   3.6500  0.9889 6.3111   &lt;- não contém 0</span>
<span class="c"># D - A == 0   2.2333 -0.4278 4.8945</span>
<span class="c"># C - B == 0   5.6367  2.9755 8.2978   &lt;- não contém 0</span>
<span class="c"># D - B == 0   4.2200  1.5589 6.8811   &lt;- não contém 0</span>
<span class="c"># D - C == 0  -1.4167 -4.0778 1.2445</span>
<span class="c"># Dunnett com B como referência:</span>
paper$Fiber.type &lt;- relevel(paper$Fiber.type, ref = "B")
mc2 &lt;- glht(aov(TS.kPa ~ Fiber.type, data = paper), linfct = mcp(Fiber.type = "Dunnett"))</pre>
<p>Leitura: um IC simultâneo que não contém zero indica diferença significativa. C supera A e B; D supera B; C e D não se distinguem.</p>

<h2>Tamanho amostral</h2>
<ul>
<li><strong>Para as comparações:</strong> corrija o α (por exemplo, Bonferroni α/K) e use a fórmula do teste t de duas amostras com <span class="m">α<sub>aj</sub></span>.</li>
<li><strong>Só para o teste global:</strong> <code>power.anova.test</code>. Exemplo do slide: a = 4, σ = 7, δ* = 12, cenário conservador τ = (−6, 6, 0, 0), poder 0,8 → n = 8,46 → <strong>9 por grupo</strong>.</li>
</ul>

<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li>Rejeitar <span class="m">H₀</span> na ANOVA significa “pelo menos um nível difere”, não “todos diferem”.</li>
<li>As premissas são sobre os <strong>resíduos</strong> do modelo.</li>
<li>Tukey com a = 5 faz 10 comparações; Dunnett faz 4. Menos comparações → correção menor → mais poder.</li>
</ul></div>
<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p><strong>EC02</strong> = ANOVA com 5 ações e 35 retornos cada: <code>aov(retorno ~ acao)</code>, rejeitou H₀ (p = 1,32 × 10⁻⁴). A pergunta “qual ação rende mais?” é do tipo todos contra um, então o confirmatório foi Dunnett contra a ação de maior média (V1), e o Tukey ficou como exploratório. O relatório registrou como limitação que a referência foi escolhida depois de ver os dados.</p></div>
`,

{q:'Por que não comparar 4 grupos com vários testes t aos pares, sem correção?', o:['Porque o uso repetido dos mesmos dados infla a probabilidade de pelo menos um falso positivo','Porque o teste t não funciona com mais de 30 observações','Porque a ANOVA não exige premissas','Porque o teste t só compara variâncias'], c:0, e:'Cada teste tem chance α de erro tipo I. Com K testes, o erro da família cresce.'},
