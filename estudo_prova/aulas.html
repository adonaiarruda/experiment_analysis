/* ===================================================== FASE 10 */
{
id:'naoparametricos', n:10, grupo:'Mais de dois grupos',
titulo:'Dados não Normais e Métodos não Paramétricos',
aula:'Aula 09', slides:'9_NaoNormais.pdf · codigos/09-nao-normalidade',
tldr:'Quando as premissas do teste paramétrico não valem, há três famílias de alternativas: testes de postos (sinal, Wilcoxon), testes de permutação e bootstrap. Transformar os dados também é uma opção, mas pode não dar certo.',
html:`
<h2>Relembrando o teste de hipóteses</h2>
<p>Num teste z bilateral, o p-valor é <span class="m">P(|Z| ≥ ẑ | H₀)</span>: a probabilidade de uma estatística tão grande quanto a observada se <span class="m">H₀</span> for verdadeira. Se <span class="m">p ≤ α</span>, rejeitamos <span class="m">H₀</span> com confiança 1 − α.</p>
<p>Métodos <strong>paramétricos</strong> assumem uma distribuição conhecida (normal, ou ao menos simétrica) e inferem sobre parâmetros (média, variância). Só devem ser usados se as premissas forem atendidas. O TCL ajuda para a média quando os dados são contínuos, simétricos, unimodais e n é razoável.</p>

<h2>Quando usar não paramétricos</h2>
<ul>
<li>As premissas do paramétrico não são atendidas.</li>
<li>O teste paramétrico foi inconclusivo.</li>
<li>Os dados são postos (ordem), contagens de eventos (sim/não) ou contagens por categoria.</li>
<li>Você quer inferir sobre parâmetros genéricos, como um percentil.</li>
</ul>

<h2>Testes de postos</h2>
<h3>Teste do sinal (mediana)</h3>
<p>Premissas: amostra iid e distribuição contínua. Se a mediana é θ₀, cada observação tem 50% de chance de cair acima dela. Conta-se <span class="m">r₊</span> (diferenças positivas) e compara-se com uma Binomial(n, 0,5).</p>
<div class="note exemplo"><span class="tag">Exemplo do slide</span>
<p>Tempo até a falha de um componente (semanas): 49, 58, 75, 110, 112, 132, 151, 276, 281, 362. O fabricante diz que a mediana é 200. <span class="m">H₀: θ = 200</span>, <span class="m">H₁: θ &lt; 200</span>.</p>
<p>Só 3 valores estão acima de 200: <span class="m">r₊ = 3</span>. p-valor = <span class="m">P(R₊ ≤ 3) = 0,0010 + 0,0098 + 0,0439 + 0,1172 = 0,1719</span> (<code>pbinom(3, 10, 0.5)</code>). <strong>Não rejeita</strong> com α = 0,05.</p>
<p>Detalhe: os p-valores são discretos. Com n = 10, só rejeitaria se r₊ fosse 0 (p = 0,001) ou 1 (p = 0,0107). O teste também serve para quartis e percentis (Binomial com p = 0,25 ou 0,75).</p></div>

<h3>Wilcoxon dos postos sinalizados</h3>
<p>Premissas: iid, contínua <strong>e simétrica</strong>. Usa o sinal <em>e</em> a magnitude: ordena as diferenças absolutas, dá postos e soma os postos positivos (<span class="m">S₊</span>) e negativos (<span class="m">S₋</span>). Sob <span class="m">H₀</span>, <span class="m">S₊ ≈ S₋</span>.</p>
<ul>
<li>Frequência cardíaca (12 pessoas), <span class="m">H₀: θ = 15</span>: S₊ = 14 e S₋ = 64; <code>wilcox.test</code> deu V = 14, p = 0,052.</li>
<li><strong>Pareado</strong>, gêmeos (maternal × casa), <span class="m">H₁: θ<sub>D</sub> &gt; 0</span>: V = 32, p = 0,027 → rejeita.</li>
</ul>

<h2>Teste de permutação</h2>
<p>Se <span class="m">H₀</span> (mesmo parâmetro nos dois processos) é verdadeira, os rótulos “X” e “Y” são intercambiáveis. Embaralhe os rótulos R vezes, recalcule a estatística em cada embaralhamento e veja quão extremo é o valor observado:</p>
<div class="formula">p-valor = (1 + #{t*<sub>r</sub> ≥ t̂}) / (R + 1)<small>use R ≥ 99; na prática 999 ou 9999</small></div>
<p>Exemplo do slide: tempo de processamento de duas versões de software, 10 000 permutações, p ≈ 0,0005.</p>
<p class="muted">A estatística é escolhida pelo contexto: diferença de médias se as distribuições não forem muito distantes da normal, diferença de medianas se forem assimétricas.</p>

<h2>Bootstrap</h2>
<p>Reamostragem <strong>com reposição</strong>, de tamanho n, a partir da amostra observada, que precisa ser representativa (experimento bem planejado). Serve para erro padrão, ICs, intervalos de predição, testes e regressão.</p>
<ul>
<li><strong>Bootstrap não gera dados novos.</strong> Ele reaproveita os que você tem.</li>
<li>No teste, a reamostragem deve respeitar <span class="m">H₀</span>. No exemplo do slide (X e Y do mesmo processo), reamostra-se do conjunto unido: R = 999, p = 0,036.</li>
<li>Paramétrico (reamostra de uma F̂₀ ajustada) ou não paramétrico (só dos dados).</li>
</ul>

<h2>Outros testes (slide 53)</h2>
<div class="tw"><table class="t">
<thead><tr><th>Teste</th><th>Substitui / serve para</th></tr></thead>
<tbody>
<tr><td>Mann-Whitney (U)</td><td>Diferença de medianas entre duas populações independentes (alternativa ao t de duas amostras)</td></tr>
<tr><td>Wilcoxon pareado</td><td>Alternativa ao t pareado</td></tr>
<tr><td>Kruskal-Wallis</td><td>Alternativa não paramétrica à ANOVA</td></tr>
<tr><td>Friedman</td><td>Mediana em experimento com blocos (alternativa ao RCBD)</td></tr>
<tr><td>Kolmogorov-Smirnov</td><td>Ajuste a uma distribuição</td></tr>
<tr><td>Spearman</td><td>Correlação por postos</td></tr>
</tbody></table></div>

<div class="note analogia"><span class="tag">Analogias</span>
<ul>
<li><strong>Sinal:</strong> cara ou coroa. Se a mediana fosse mesmo 200, cada componente seria uma moeda honesta (acima ou abaixo).</li>

{
id:'blocagem', n:11, grupo:'Planejamentos avançados',
titulo:'Blocagem (RCBD)',
aula:'Aula 10', slides:'10_Blocagem.pdf · codigos/10-Blocagem',
tldr:'Blocagem é o pareamento generalizado. Se um fator indesejável é conhecido e controlável, cada bloco recebe todos os tratamentos e o efeito do bloco sai do resíduo. O teste fica mais sensível e pede menos observações.',
html:`
<h2>O problema: fatores indesejáveis</h2>
<p>O CRD da ANOVA supõe condições homogêneas. Mas muitas vezes há fatores que influenciam a resposta sem serem de interesse: os <strong>fatores indesejáveis</strong> (nuisance factors). Eles podem ser:</p>
<ol class="passos">
<li><div>Desconhecidos e não controláveis → <strong>aleatorizar</strong>.</div></li>
<li><div>Conhecidos, mas não controláveis.</div></li>
<li><div>Conhecidos e controláveis → <strong>bloquear</strong>.</div></li>
</ol>
<p class="lead">“Block what you can, randomize what you cannot.” (George Box)</p>
<p>Exemplos: lotes de matéria-prima ao comparar reações químicas; problemas de benchmark ao comparar algoritmos. Se você estiver interessado no efeito desse fator, ele deixa de ser indesejável e vira um fator experimental.</p>

<div class="note exemplo"><span class="tag">Exemplo do slide: roteamento de veículos</span>
<p>Um algoritmo padrão é comparado com 6 versões modificadas em 180 instâncias, divididas em 36 grupos homogêneos, com 30 execuções por instância. Cada grupo de instâncias é um <strong>bloco</strong>. Resposta: média das 30 execuções nas 5 instâncias do grupo → uma observação por algoritmo por bloco (36 por algoritmo).</p></div>

<h2>RCBD: premissas do desenho</h2>
<ul>
<li>Uma observação por tratamento por bloco (com várias, use GRBD).</li>
<li>Blocos independentes.</li>
<li>Aleatorização intra-bloco independente. Em experimentos computacionais ela é dispensável se efeitos de ordem, aquecimento e carga da máquina forem controlados.</li>
</ul>
<p>Usar blocos que não são independentes gera <strong>pseudorreplicação</strong>: graus de liberdade errados e aumento do erro tipo I.</p>

<h2>Modelo e teste</h2>
<div class="formula">y<sub>ij</sub> = μ + τ<sub>i</sub> + β<sub>j</sub> + ε<sub>ij</sub>, &nbsp; Σ τ<sub>i</sub> = Σ β<sub>j</sub> = 0<small>i = 1…a tratamentos · j = 1…b blocos</small></div>
<div class="formula">H₀: τ<sub>i</sub> = 0 ∀ i &nbsp;&nbsp; H₁: ∃ τ<sub>i</sub> ≠ 0 &nbsp; (testamos só o fator de interesse)</div>
<div class="formula">SS<sub>T</sub> = SS<sub>níveis</sub> + SS<sub>blocos</sub> + SS<sub>E</sub> &nbsp;·&nbsp; gl: (a − 1), (b − 1), (a − 1)(b − 1)</div>
<div class="formula">F₀ = MS<sub>níveis</sub> / MS<sub>E</sub> &nbsp;~&nbsp; F<sub>(a−1), (a−1)(b−1)</sub></div>
<pre class="r">model &lt;- aov(Y ~ Algorithm + Instance_Group, data = aggdata)
<span class="c">#                 Df   Sum Sq Mean Sq F value Pr(>F)</span>
<span class="c"># Algorithm        6   359949   59991   41.75 &lt;2e-16</span>
<span class="c"># Instance_Group  35 60438639 1726818 1201.86 &lt;2e-16</span>
<span class="c"># Residuals      210   301725    1437</span>
<span class="c"># diagnóstico ruim -> resposta em log</span>
model2 &lt;- aov(log(Y) ~ Algorithm + Instance_Group, data = aggdata)
<span class="c"># Algorithm F = 120.4 ;  R² = 0.998</span></pre>
<p>Confira os gl: a = 7 algoritmos, b = 36 blocos → resíduo (7 − 1)(36 − 1) = 210. Os gráficos de resíduos do primeiro modelo eram ruins, e o log resolveu.</p>

<h2>Eficiência da blocagem</h2>
<div class="formula">E = [(b − 1) MS<sub>blocos</sub> + b(a − 1) MS<sub>E</sub>] / [(ab − 1) MS<sub>E</sub>]</div>
<p>Quanto o CRD precisaria crescer para ter o mesmo poder do RCBD. E = 1,3 → o CRD precisaria de 30% mais observações. No exemplo (modelo em log), E = 431,6.</p>

<h2>Tamanho amostral e comparações</h2>
<ul>
<li>Use as mesmas fórmulas do CRD. O n calculado é o <strong>número de blocos</strong>.</li>
<li>A variância a usar é a <strong>residual</strong>, já sem o efeito do bloco, estimada por piloto ou estudos anteriores.</li>
<li>Comparações post-hoc: como na ANOVA, com testes t pareados e gl do erro (a − 1)(b − 1). Todos contra um → <strong>Dunnett</strong>, como no exemplo (6 modificações × padrão).</li>
<li>Dois fatores indesejáveis: quadrado latino. Três ou mais: hipercubo latino.</li>
</ul>
<pre class="r">duntest &lt;- glht(model2, linfct = mcp(Algorithm = "Dunnett"))
plot(confint(duntest), xlab = "Mean difference (log scale)")</pre>

<div class="note analogia"><span class="tag">Analogia</span>
<p>Você quer comparar 3 adubos, mas tem terrenos muito diferentes (sol, solo, água). Em vez de sortear um terreno para cada adubo, divide cada terreno em 3 faixas e aplica os 3 adubos em todos. A comparação acontece dentro de cada terreno. O terreno é o bloco.</p></div>
<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li>A hipótese testada é só sobre τ. O bloco ser significativo não é a pergunta, apenas mostra que bloquear valeu a pena.</li>
<li>Pareamento = RCBD com 2 tratamentos.</li>
<li>O custo de bloquear é pequeno em relação ao CRD. O slide recomenda escolhê-lo sempre que possível.</li>
</ul></div>
<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p><strong>EC03:</strong> a instância é o bloco, e com 2 configurações o RCBD vira o t pareado. <strong>EC02:</strong> o relatório testou se o mês funcionava como bloco (efeito comum de mercado). Não foi significativo, e o modelo sem bloco foi mantido. <strong>EC03, melhorias:</strong> um fatorial 2² mantendo as instâncias como blocos.</p></div>
`,

id:'fatorial', n:12, grupo:'Planejamentos avançados',
titulo:'Experimento Fatorial',
aula:'Aula 11', slides:'11_ExpFatorial.pdf · codigos/11-Planejamento_Fatorial',
tldr:'Com mais de um fator de interesse, teste todas as combinações de níveis. Assim você estima os efeitos principais e as interações, ou seja, quando o efeito de um fator depende do nível de outro.',
html:`
<h2>Efeito principal e interação</h2>
<ul>
<li><strong>Efeito principal:</strong> mudança média na resposta quando um fator muda de nível.</li>
<li><strong>Interação:</strong> a resposta à mudança de um fator <em>depende</em> do nível de outro fator.</li>
</ul>
<p>O gráfico de interação mostra isso direto: <strong>linhas paralelas = sem interação</strong>; linhas não paralelas ou cruzadas = interação. Esse gráfico é útil para interpretar e para explicar o resultado a quem não tem formação estatística.</p>
<div class="widget" data-widget="interacao"></div>
<div class="note analogia"><span class="tag">Analogia</span>
<p>Um remédio e uma bebida alcoólica. Sozinhos, cada um tem um efeito conhecido. Juntos, o efeito pode ser muito diferente da soma. Isso é interação, e só aparece se você testar a combinação.</p></div>

<div class="note exemplo"><span class="tag">Exemplo do slide: corrente de motores</span>
<p>Fatores: <strong>Fabricante</strong> (A, B, C) e <strong>Estado</strong> (Original, Rebobinado). 40 motores por fabricante (20 originais e 20 rebobinados) → n = 20 por combinação, 120 no total. α = 0,05, β = 0,2, δ* = 0,1 A. O boxplot sugere diferença entre estados, efeito de fabricante pouco claro e interação pequena.</p></div>

<h2>Modelo com dois fatores</h2>
<div class="formula">y<sub>ijk</sub> = μ + τ<sub>i</sub> + β<sub>j</sub> + (τβ)<sub>ij</sub> + ε<sub>ijk</sub><small>i = 1…a (fator A) · j = 1…b (fator B) · k = 1…n repetições · coleta completamente aleatorizada · efeitos somam zero</small></div>
<p>Três pares de hipóteses: efeito principal de A (<span class="m">τ<sub>i</sub> = 0 ∀i</span>), efeito principal de B (<span class="m">β<sub>j</sub> = 0 ∀j</span>) e interação AB (<span class="m">(τβ)<sub>ij</sub> = 0 ∀i,j</span>).</p>
<div class="tw"><table class="t">
<thead><tr><th>Fonte</th><th>gl</th><th>F₀</th></tr></thead>
<tbody>
<tr><td>A</td><td>a − 1</td><td>MS<sub>A</sub>/MS<sub>E</sub></td></tr>
<tr><td>B</td><td>b − 1</td><td>MS<sub>B</sub>/MS<sub>E</sub></td></tr>
<tr><td>AB</td><td>(a − 1)(b − 1)</td><td>MS<sub>AB</sub>/MS<sub>E</sub></td></tr>
<tr><td>Erro</td><td>ab(n − 1)</td><td></td></tr>
</tbody></table></div>
<p><strong>É preciso n ≥ 2</strong> repetições por combinação para separar SS<sub>AB</sub> de SS<sub>E</sub>.</p>
<pre class="r">model &lt;- aov(Current.Amperes ~ State * Manufacturer, data = data)
<span class="c">#                     Df Sum Sq Mean Sq F value   Pr(>F)</span>
<span class="c"># State                1 12.956  12.956 2798.41  &lt; 2e-16</span>
<span class="c"># Manufacturer         2  0.118   0.059   12.71 1.04e-05</span>
<span class="c"># State:Manufacturer   2  0.114   0.057   12.27 1.49e-05</span>
<span class="c"># Residuals          114  0.528   0.005          R² = 0.96</span>
shapiro.test(model$residuals)                                          <span class="c"># p = 0.2392</span>
fligner.test(Current.Amperes ~ interaction(State, Manufacturer), data) <span class="c"># p = 0.0705</span></pre>
<p>Confira: resíduo = ab(n − 1) = 2 × 3 × 19 = 114. Os três efeitos são significativos, inclusive a interação. A independência deve ser sustentada pelo planejamento.</p>

<h2>Comparações múltiplas</h2>
<ul>
<li><strong>Sem interação significativa:</strong> compare os níveis de cada fator pelos efeitos médios, com <span class="m">t₀ = Δȳ / √(2 MS<sub>E</sub>/n′)</span>, em que n′ é o nº de observações em cada nível. Ajuste o α (Tukey, por exemplo).</li>
<li><strong>Com interação:</strong> compare as <strong>combinações</strong> de níveis. Crie um meta-fator e refaça o modelo. No slide: todos contra o motor Original.B, com Dunnett.</li>
</ul>
<pre class="r">interfac &lt;- with(data, interaction(State, Manufacturer))
interfac &lt;- relevel(interfac, ref = "Original.B")
model2   &lt;- aov(Current.Amperes ~ interfac, data = data)
mcp.inter &lt;- glht(model2, linfct = mcp(interfac = "Dunnett"))</pre>
<p><strong>Recomendações do slide:</strong> motores rebobinados consomem mais corrente. Possíveis decisões: substituir gradualmente por motores novos do fabricante B, descartar em vez de rebobinar, ou avaliar outra forma de rebobinamento.</p>

<h2>Mais de dois fatores</h2>
<p>Com fatores A, B, C… e n ≥ 2 repetições, são <span class="m">a·b·c·…·n</span> observações. O modelo de 3 fatores tem efeitos principais, interações de 2ª ordem (AB, AC, BC) e de 3ª ordem (ABC).</p>
<div class="note exemplo"><span class="tag">Exemplo do slide: lentes intraoculares (2³)</span>
<p>Três fatores com dois níveis cada (tempo de torno, tempo de polimento, idade da ferramenta), <strong>uma única réplica</strong> (8 lotes de 30 lentes). Resposta: proporção de lentes conformes. Experimento aleatorizado e parcialmente cego.</p>
<p>Sem repetição não sobram gl para o MS<sub>E</sub>, e o modelo saturado não tem teste. Solução: <strong>princípio da esparsidade</strong> (sistemas são dominados por efeitos principais e de baixa ordem). Remova primeiro as interações de maior ordem, que passam a compor o resíduo. O <strong>gráfico de Daniel</strong> (QQ normal dos efeitos estimados; só para 2<sup>k</sup>) ajuda: efeitos fortes aparecem como pontos fora da reta.</p>
<pre class="r">model2 &lt;- aov(Conf.rate ~ ., data = data)   <span class="c"># só efeitos principais</span>
<span class="c"># CNCTime  F = 276.6  p = 7.66e-05</span>
<span class="c"># PolTime  F =  46.2  p = 0.00244</span>
<span class="c"># ToolAge  F =   5.6  p = 0.0763      Residuals: 4 gl</span></pre>
<p>Conclusões: o tempo de torno é o efeito mais forte (conformidade de 0,36 para 0,87); polimento de 5 → 7 dias leva de 0,51 para 0,72. A idade da ferramenta não foi significativa, o que pode ser ausência de efeito ou baixo tamanho amostral.</p></div>

<h3>Blocagem em fatoriais</h3>
<p>Funciona como no caso de um fator: no RCBD, cada bloco contém uma observação de <em>cada combinação</em> de níveis.</p>

<div class="note pegadinha"><span class="tag">Pegadinhas</span>
<ul>
<li>Com interação significativa, interpretar só os efeitos principais pode enganar. Olhe as combinações.</li>
<li>Uma réplica (n = 1) → não há como estimar MS<sub>E</sub> no modelo completo.</li>
<li>COST (aula 02) falha justamente quando há interação. O fatorial é a resposta.</li>
</ul></div>
<div class="note ec"><span class="tag">Nos estudos de caso</span>
<p>No EC03 as duas configurações diferiam ao mesmo tempo no operador de recombinação e no parâmetro F, então não dá para atribuir a diferença a um deles. A melhoria proposta é um <strong>fatorial 2²</strong> (recombinação × F) com as instâncias como blocos.</p></div>

/* ---------- quiz ---------- */
function montarQuiz(f, box){
  const itens = f.quiz.map(q => ({ q: q, perm: embaralhar([0, 1, 2, 3]) }));
  const n = itens.length;
  let acertos = 0, respondidas = 0;
  const r = progresso[f.id];
  box.innerHTML =
    '<div class="quiz-head"><h2>Quiz da fase</h2><span class="muted">' + (r ? 'Melhor resultado: ' + r.best + '/' + r.total : 'Ainda não feito') + '</span></div>' +
    '<p class="muted">Responda e veja a explicação na hora. A ordem das alternativas muda a cada tentativa.</p>' +
    itens.map((it, qi) =>
      '<div class="q" data-q="' + qi + '">' +
        '<div class="q-n">Questão ' + (qi + 1) + ' de ' + n + '</div>' +
        '<div class="q-text">' + esc(it.q.q) + '</div>' +
        '<div class="opts">' + it.perm.map((oi, pos) =>
          '<button type="button" class="opt" data-o="' + oi + '"><span class="k">' + LETRAS[pos] + '</span><span>' + esc(it.q.o[oi]) + '</span></button>').join('') +
        '</div><div class="exp" hidden></div>' +
      '</div>').join('') +
    '<div class="resultado" id="resultado" hidden></div>';

  box.onclick = ev => {
    const b = ev.target.closest('.opt');
    if (b && !b.disabled){
      const card = b.closest('.q');
      const it = itens[+card.dataset.q];
      const escolhida = +b.dataset.o;
      const certa = it.q.c;
      card.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (+o.dataset.o === certa) o.classList.add('certa'); });
      const ok = escolhida === certa;
      if (!ok) b.classList.add('errada');
      const letraCerta = LETRAS[it.perm.indexOf(certa)];
      const exp = card.querySelector('.exp');
      exp.innerHTML = (ok ? '<span class="ok">Correto.</span> ' : '<span class="no">A certa é a (' + letraCerta + ').</span> ') + esc(it.q.e);
      exp.hidden = false;
      respondidas++; if (ok) acertos++;
      if (respondidas === n) finalizar();
      return;
    }
    if (ev.target.closest('[data-act="refazer"]')){ montarQuiz(f, box); box.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  };

  function finalizar(){
    const ant = progresso[f.id];
    const best = Math.max(acertos, ant ? ant.best : 0);
    progresso[f.id] = { best: best, total: n, last: acertos };
    salvarProgresso(progresso);
    const est = estrelas(f.id);
    const p = acertos / n;
    const msg = p === 1 ? 'Gabaritou. Pode seguir para a próxima fase.'
      : p >= 0.85 ? 'Muito bom. Releia a explicação da questão que errou.'
      : p >= 0.6 ? 'Bom caminho. Volte às seções ligadas às questões erradas e refaça.'
      : 'Vale reler a fase com calma antes de seguir. As pegadinhas no texto são as mesmas do quiz.';
    const res = $('#resultado', box);
    res.innerHTML = '<span class="big">' + acertos + '/' + n + '</span>' + htmlEstrelas(est) +
      '<span style="flex:1 1 16rem">' + msg + '</span><button type="button" class="btn ghost" data-act="refazer">Refazer o quiz</button>';
    res.hidden = false;
    renderNav(f.id);
  }
}

/* ---------- roteador ---------- */
function idDoHash(){ try { return (location.hash || '#inicio').slice(1); } catch(e){ return 'inicio'; } }
function ehRota(id){ return id === 'inicio' || FASES.some(x => x.id === id); }
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href').slice(1); if (!ehRota(id)) return;
  ev.preventDefault();
  try { if (idDoHash() !== id) history.pushState(null, '', '#' + id); } catch(e){}
  rota(id);
});
window.addEventListener('popstate', () => rota());
function rota(destino){
  const id = destino || idDoHash();
  const f = FASES.find(x => x.id === id);
  if (f){ renderFase(f); renderNav(f.id); document.title = f.titulo + ' · Trilha EEE933'; }
  else { renderInicio(); renderNav('inicio'); document.title = 'Trilha de Estudos EEE933'; }
  if (!mq.matches) navbox.open = false;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => rota());

/* ---------- desenho SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, txt){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; }
function limpar(svg){ while (svg.firstChild) svg.removeChild(svg.firstChild); }
function seg(container, onPick){
  container.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    container.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    onPick(b);
  });
}

const WIDGETS = {};

/* TCL ------------------------------------------------------------ */
WIDGETS.tcl = function(box){
  box.innerHTML =
    '<div class="w-head"><b>Laboratório · Teorema Central do Limite</b><span>Reproduz o script da aula 03: sorteia N = 1000 amostras de tamanho n e desenha o histograma das 1000 médias. A curva é a normal N(μ, σ²/n) prevista pelo TCL.</span></div>' +
    '<div class="ctrl"><div class="seg" data-k="d" role="group" aria-label="População"><button type="button" data-v="unif" aria-pressed="true">Uniforme(2, 6)</button><button type="button" data-v="exp" aria-pressed="false">Exponencial(taxa 2,2)</button></div>' +
    '<div class="seg" data-k="n" role="group" aria-label="Tamanho da amostra">' + [1, 2, 5, 30, 100].map(v => '<button type="button" data-v="' + v + '" aria-pressed="' + (v === 1) + '">n = ' + v + '</button>').join('') + '</div>' +
    '<button type="button" class="btn ghost" data-act="go">Sortear de novo</button></div>' +
    '<svg class="plot" viewBox="0 0 640 240" role="img" aria-label="Histograma das médias amostrais"></svg><p class="w-out"></p>';
  const st = { d: 'unif', n: 1 };
  const svg = $('svg', box), out = $('.w-out', box);
  seg($('[data-k="d"]', box), b => { st.d = b.dataset.v; draw(); });
  seg($('[data-k="n"]', box), b => { st.n = +b.dataset.v; draw(); });
  $('[data-act="go"]', box).onclick = draw;
  function draw(){
    const N = 1000, n = st.n, unif = st.d === 'unif';
    const mu = unif ? 4 : 1 / 2.2, sigma = unif ? 4 / Math.sqrt(12) : 1 / 2.2, se = sigma / Math.sqrt(n);
    const lo = unif ? 2 : 0, hi = unif ? 6 : 2.5, nb = 40, bw = (hi - lo) / nb;
    const cont = new Array(nb).fill(0); let soma = 0, soma2 = 0;
    for (let i = 0; i < N; i++){
      let s = 0;
      for (let k = 0; k < n; k++) s += unif ? 2 + 4 * Math.random() : -Math.log(1 - Math.random()) / 2.2;
      const m = s / n; soma += m; soma2 += m * m;
      cont[Math.min(nb - 1, Math.max(0, Math.floor((m - lo) / bw)))]++;
    }
    const media = soma / N, dp = Math.sqrt((soma2 - N * media * media) / (N - 1));
    const dens = cont.map(c => c / (N * bw));
    const pico = 1 / (se * Math.sqrt(2 * Math.PI));
    const ymax = Math.max(Math.max.apply(null, dens), Math.min(pico, Math.max.apply(null, dens) * 1.6)) * 1.08;
    const L = 40, R = 628, T = 10, B = 210;
    const X = x => L + (x - lo) / (hi - lo) * (R - L), Y = y => B - Math.min(y, ymax) / ymax * (B - T);
    limpar(svg);
    svg.appendChild(el('line', { x1: L, x2: R, y1: B, y2: B, class: 'axis' }));
    dens.forEach((d, i) => svg.appendChild(el('rect', { x: X(lo + i * bw) + 0.5, y: Y(d), width: Math.max(0, (R - L) / nb - 1), height: B - Y(d), class: 'p-bar' })));
    let path = '';
    for (let k = 0; k <= 200; k++){ const x = lo + (hi - lo) * k / 200; const y = Math.exp(-0.5 * ((x - mu) / se) ** 2) / (se * Math.sqrt(2 * Math.PI)); path += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); }
    svg.appendChild(el('path', { d: path, class: 'p-curve' }));
    svg.appendChild(el('line', { x1: X(mu), x2: X(mu), y1: T, y2: B, class: 'p-mu' }));
    const ticks = unif ? [2, 3, 4, 5, 6] : [0, 0.5, 1, 1.5, 2, 2.5];
    ticks.forEach(t => svg.appendChild(el('text', { x: X(t), y: B + 16, 'text-anchor': 'middle' }, fmt(t, t % 1 ? 1 : 0))));
    svg.appendChild(el('text', { x: X(mu) + 5, y: T + 10 }, 'μ'));
    out.innerHTML = 'média das médias = <b>' + fmt(media, 3) + '</b> (μ = ' + fmt(mu, 3) + ') · dp das médias = <b>' + fmt(dp, 3) + '</b> (σ/√n = ' + fmt(se, 3) + ')' +
      (n === 1 ? '<br>Com n = 1 o histograma é a própria população. Aumente n e veja a forma de sino aparecer.' : n >= 30 ? '<br>Com n = ' + n + ' a distribuição das médias já é praticamente normal, e bem mais estreita.' : '');
  }
  draw();
};

/* IC --------------------------------------------------------------- */
WIDGETS.ic = function(box){
  box.innerHTML =
    '<div class="w-head"><b>Laboratório · O que significa “95% de confiança”</b><span>Reproduz o script da aula 04: amostras de N(50, 5²), IC com t de Student. Verde contém μ = 50; vermelho não contém.</span></div>' +
    '<div class="ctrl"><div class="seg" data-k="c" role="group" aria-label="Nível de confiança">' + [90, 95, 99].map(v => '<button type="button" data-v="' + v + '" aria-pressed="' + (v === 95) + '">' + v + '%</button>').join('') + '</div>' +
    '<div class="seg" data-k="n" role="group" aria-label="Tamanho da amostra"><button type="button" data-v="5" aria-pressed="true">n = 5</button><button type="button" data-v="25" aria-pressed="false">n = 25</button></div>' +
    '<button type="button" class="btn" data-act="20">Gerar 20 intervalos</button><button type="button" class="btn ghost" data-act="100">Gerar 100</button></div>' +
    '<svg class="plot" viewBox="0 0 640 260" role="img" aria-label="Intervalos de confiança simulados"></svg><p class="w-out"></p>';
  const T = { 5: { 90: 2.132, 95: 2.776, 99: 4.604 }, 25: { 90: 1.711, 95: 2.064, 99: 2.797 } };
  const st = { c: 95, n: 5, k: 20 }, acum = { dentro: 0, total: 0 };
  const svg = $('svg', box), out = $('.w-out', box);
  seg($('[data-k="c"]', box), b => { st.c = +b.dataset.v; acum.dentro = acum.total = 0; draw(); });
  seg($('[data-k="n"]', box), b => { st.n = +b.dataset.v; acum.dentro = acum.total = 0; draw(); });
  $('[data-act="20"]', box).onclick = () => { st.k = 20; draw(); };
  $('[data-act="100"]', box).onclick = () => { st.k = 100; draw(); };
  function draw(){
    const k = st.k, n = st.n, t = T[n][st.c];
    const rowH = k === 20 ? 11 : 2.4, top = 8, H = top + k * rowH + 30;
    svg.setAttribute('viewBox', '0 0 640 ' + H);
    const lo = 36, hi = 64, L = 20, R = 620, X = x => L + (Math.min(hi, Math.max(lo, x)) - lo) / (hi - lo) * (R - L);
    limpar(svg);
    let dentro = 0;
    for (let i = 0; i < k; i++){
      let s = 0, s2 = 0; const xs = [];
      for (let j = 0; j < n; j++){ const x = 50 + 5 * randn(); xs.push(x); s += x; }
      const m = s / n; xs.forEach(x => s2 += (x - m) ** 2);
      const h = t * Math.sqrt(s2 / (n - 1)) / Math.sqrt(n);
      const ok = Math.abs(m - 50) <= h; if (ok) dentro++;
      const y = top + i * rowH + rowH / 2;
      svg.appendChild(el('line', { x1: X(m - h), x2: X(m + h), y1: y, y2: y, class: ok ? 'p-ok' : 'p-no', 'stroke-width': k === 20 ? 2.5 : 1.4 }));
      if (k === 20) svg.appendChild(el('circle', { cx: X(m), cy: y, r: 2.6, class: ok ? 'p-okf' : 'p-nof' }));
    }
    const yb = top + k * rowH + 4;
    svg.appendChild(el('line', { x1: X(50), x2: X(50), y1: 2, y2: yb, class: 'p-mu' }));
    svg.appendChild(el('line', { x1: L, x2: R, y1: yb, y2: yb, class: 'axis' }));
    [40, 45, 50, 55, 60].forEach(v => svg.appendChild(el('text', { x: X(v), y: yb + 16, 'text-anchor': 'middle' }, v === 50 ? 'μ = 50' : String(v))));
    acum.dentro += dentro; acum.total += k;
    out.innerHTML = 'Nesta rodada: <b>' + dentro + ' de ' + k + '</b> contêm μ. Acumulado: <b>' + acum.dentro + ' de ' + acum.total + '</b> (' + fmt(100 * acum.dentro / acum.total, 1) + '%; o procedimento promete ' + st.c + '%). Quantil usado: t = ' + fmt(t, 3) + ' com ' + (n - 1) + ' gl.';
  }
  draw();
};

/* PODER ------------------------------------------------------------ */
WIDGETS.poder = function(box){
  box.innerHTML =
    '<div class="w-head"><b>Laboratório · α, β e poder</b><span>Distribuição da média amostral sob H₀ (cinza) e sob H₁ (azul), em unidades de σ. Teste unilateral com aproximação normal, apenas para visualizar o comportamento.</span></div>' +
    '<div class="ctrl">' +
      '<label for="pw-d"><span>efeito real δ/σ = <b data-o="d"></b></span><input type="range" id="pw-d" min="0" max="1.5" step="0.05" value="0.5"></label>' +
      '<label for="pw-n"><span>tamanho amostral n = <b data-o="n"></b></span><input type="range" id="pw-n" min="2" max="80" step="1" value="10"></label>' +
      '<div class="seg" data-k="a" role="group" aria-label="Nível de significância">' + ['0.01', '0.05', '0.10'].map(v => '<button type="button" data-v="' + v + '" aria-pressed="' + (v === '0.05') + '">α = ' + v.replace('.', ',') + '</button>').join('') + '</div>' +
    '</div>' +
    '<svg class="plot" viewBox="0 0 640 230" role="img" aria-label="Curvas de H0 e H1 com áreas de alfa, beta e poder"></svg>' +
    '<div class="readout"><div><span>α (falso positivo)</span><b data-o="alfa"></b></div><div><span>β (falso negativo)</span><b data-o="beta"></b></div><div><span>Poder 1 − β</span><b data-o="poder"></b></div><div><span>Rejeita H₀ se x̄ &gt;</span><b data-o="c"></b></div></div>';
  const Z = { '0.01': 2.326, '0.05': 1.645, '0.10': 1.282 };
  const st = { a: '0.05' };
  const svg = $('svg', box), id = $('#pw-d', box), inn = $('#pw-n', box), o = k => $('[data-o="' + k + '"]', box);
  seg($('[data-k="a"]', box), b => { st.a = b.dataset.v; draw(); });
  id.oninput = inn.oninput = draw;
  function draw(){
    const d = +id.value, n = +inn.value, se = 1 / Math.sqrt(n), z = Z[st.a], c = z * se;
    const pw = 1 - Phi((c - d) / se);
    const lo = -2.2, hi = 3.2, L = 20, R = 620, T = 12, B = 196;
    const pico = 1 / (se * Math.sqrt(2 * Math.PI)), ymax = pico * 1.12;
    const X = x => L + (x - lo) / (hi - lo) * (R - L), Y = y => B - y / ymax * (B - T);
    const pdf = (x, m) => Math.exp(-0.5 * ((x - m) / se) ** 2) / (se * Math.sqrt(2 * Math.PI));
    function area(m, a, b, cls){ a = Math.max(lo, a); b = Math.min(hi, b); if (b <= a) return; let p = 'M' + X(a) + ' ' + B; for (let k = 0; k <= 120; k++){ const x = a + (b - a) * k / 120; p += 'L' + X(x).toFixed(1) + ' ' + Y(pdf(x, m)).toFixed(1); } p += 'L' + X(b) + ' ' + B + 'Z'; svg.appendChild(el('path', { d: p, class: cls })); }
    function curva(m, cls){ let p = ''; for (let k = 0; k <= 240; k++){ const x = lo + (hi - lo) * k / 240; p += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(pdf(x, m)).toFixed(1); } svg.appendChild(el('path', { d: p, class: cls })); }
    limpar(svg);
    area(d, c, hi, 'p-power'); area(d, lo, c, 'p-beta'); area(0, c, hi, 'p-alpha');
    curva(0, 'p-h0'); curva(d, 'p-h1');
    svg.appendChild(el('line', { x1: L, x2: R, y1: B, y2: B, class: 'axis' }));
    svg.appendChild(el('line', { x1: X(c), x2: X(c), y1: T, y2: B, class: 'p-crit' }));
    [-2, -1, 0, 1, 2, 3].forEach(v => svg.appendChild(el('text', { x: X(v), y: B + 16, 'text-anchor': 'middle' }, String(v))));
    svg.appendChild(el('text', { x: X(0), y: Y(pico) - 4, 'text-anchor': 'middle' }, 'H₀'));
    if (d >= 0.15) svg.appendChild(el('text', { x: X(d), y: Y(pico) - 4, 'text-anchor': 'middle', class: 'p-lbl0' }, 'H₁'));
    o('d').textContent = fmt(d, 2); o('n').textContent = n;
    o('alfa').textContent = fmt(100 * (+st.a), 0) + '%';
    o('beta').textContent = fmt(100 * (1 - pw), 1) + '%';
    o('poder').textContent = fmt(100 * pw, 1) + '%';
    o('c').textContent = fmt(c, 2) + 'σ';
  }
  draw();
};

    '<div class="ctrl">' +
      '<label for="av-d"><span>distância entre as médias = <b data-o="d"></b></span><input type="range" id="av-d" min="0" max="2.5" step="0.1" value="1"></label>' +
      '<label for="av-s"><span>dispersão dentro dos grupos σ = <b data-o="s"></b></span><input type="range" id="av-s" min="0.3" max="2.5" step="0.1" value="1"></label>' +
      '<button type="button" class="btn ghost" data-act="novo">Novos dados</button>' +
    '</div>' +
    '<svg class="plot" viewBox="0 0 640 230" role="img" aria-label="Pontos de três grupos com suas médias"></svg>' +
    '<div class="readout"><div><span>MS entre (gl 2)</span><b data-o="msb"></b></div><div><span>MS dentro (gl 21)</span><b data-o="mse"></b></div><div><span>F₀</span><b data-o="f"></b></div><div><span>Decisão (α = 5%)</span><b data-o="dec"></b></div></div>';
  let Zs, jit;
  function novo(){ Zs = [0, 1, 2].map(() => Array.from({ length: 8 }, randn)); jit = [0, 1, 2].map(() => Array.from({ length: 8 }, () => (Math.random() - 0.5) * 70)); }
  novo();
  const svg = $('svg', box), id = $('#av-d', box), is = $('#av-s', box), o = k => $('[data-o="' + k + '"]', box);
  id.oninput = is.oninput = draw;
  $('[data-act="novo"]', box).onclick = () => { novo(); draw(); };
  function draw(){
    const d = +id.value, s = +is.value, mus = [-d, 0, d];
    const Ys = Zs.map((g, i) => g.map(z => mus[i] + s * z));
    const medias = Ys.map(g => g.reduce((a, b) => a + b, 0) / g.length);
    const geral = medias.reduce((a, b) => a + b, 0) / 3;
    const ssb = 8 * medias.reduce((a, m) => a + (m - geral) ** 2, 0);
    const sse = Ys.reduce((a, g, i) => a + g.reduce((b, y) => b + (y - medias[i]) ** 2, 0), 0);
    const msb = ssb / 2, mse = sse / 21, F = msb / mse;
    const L = 30, R = 630, T = 10, B = 205, lo = -8, hi = 8, Y = y => B - (Math.min(hi, Math.max(lo, y)) - lo) / (hi - lo) * (B - T);
    const xs = [130, 330, 530];
    limpar(svg);
    svg.appendChild(el('line', { x1: L, x2: R, y1: Y(geral), y2: Y(geral), class: 'p-mu' }));
    svg.appendChild(el('text', { x: R, y: Y(geral) - 5, 'text-anchor': 'end' }, 'média geral'));
    Ys.forEach((g, i) => {
      g.forEach((y, j) => svg.appendChild(el('circle', { cx: xs[i] + jit[i][j], cy: Y(y), r: 4.5, class: 'g' + i })));
      svg.appendChild(el('line', { x1: xs[i] - 55, x2: xs[i] + 55, y1: Y(medias[i]), y2: Y(medias[i]), class: 'p-mean' }));
      svg.appendChild(el('text', { x: xs[i], y: B + 18, 'text-anchor': 'middle' }, 'Grupo ' + 'ABC'[i]));
    });
    o('d').textContent = fmt(d, 1); o('s').textContent = fmt(s, 1);
    o('msb').textContent = fmt(msb, 2); o('mse').textContent = fmt(mse, 2); o('f').textContent = fmt(F, 2);
    o('dec').textContent = F > 3.47 ? 'rejeita H₀' : 'não rejeita';
  }
  draw();
};

/* INTERAÇÃO -------------------------------------------------------- */
WIDGETS.interacao = function(box){
  box.innerHTML =
    '<div class="w-head"><b>Laboratório · Gráfico de interação 2 × 2</b><span>Médias de cada combinação de níveis. Mexa no termo de interação (τβ) e veja as linhas deixarem de ser paralelas.</span></div>' +
    '<div class="ctrl">' +
      '<label for="it-a"><span>efeito principal de A = <b data-o="a"></b></span><input type="range" id="it-a" min="-3" max="3" step="0.1" value="2"></label>' +
      '<label for="it-b"><span>efeito principal de B = <b data-o="b"></b></span><input type="range" id="it-b" min="-3" max="3" step="0.1" value="1"></label>' +
      '<label for="it-ab"><span>interação AB = <b data-o="ab"></b></span><input type="range" id="it-ab" min="-3" max="3" step="0.1" value="0"></label>' +
    '</div>' +
    '<div class="ctrl"><div class="seg" data-k="p" role="group" aria-label="Exemplos prontos"><button type="button" data-v="0" aria-pressed="true">Sem interação</button><button type="button" data-v="1" aria-pressed="false">Interação moderada</button><button type="button" data-v="2" aria-pressed="false">Linhas cruzadas</button></div></div>' +
    '<svg class="plot" viewBox="0 0 640 240" role="img" aria-label="Gráfico de interação"></svg><p class="w-out"></p>';
  const PRE = [[2, 1, 0], [2, 1, 1.2], [0.4, 0.5, 2.6]];
  const svg = $('svg', box), ia = $('#it-a', box), ib = $('#it-b', box), iab = $('#it-ab', box), out = $('.w-out', box), o = k => $('[data-o="' + k + '"]', box);
  seg($('[data-k="p"]', box), b => { const p = PRE[+b.dataset.v]; ia.value = p[0]; ib.value = p[1]; iab.value = p[2]; draw(); });
  ia.oninput = ib.oninput = iab.oninput = draw;
  function draw(){
    const a = +ia.value, b = +ib.value, ab = +iab.value;
    const cel = (xa, xb) => 5 + a * xa / 2 + b * xb / 2 + ab * xa * xb / 2;
    const L = 60, R = 600, T = 14, B = 200, Y = y => B - Math.min(10, Math.max(0, y)) / 10 * (B - T), xs = [170, 470];
    limpar(svg);
    svg.appendChild(el('line', { x1: L, x2: R, y1: B, y2: B, class: 'axis' }));
    svg.appendChild(el('line', { x1: L, x2: L, y1: T, y2: B, class: 'axis' }));
    [0, 2.5, 5, 7.5, 10].forEach(v => svg.appendChild(el('text', { x: L - 8, y: Y(v) + 4, 'text-anchor': 'end' }, fmt(v, v % 1 ? 1 : 0))));
    svg.appendChild(el('text', { x: xs[0], y: B + 18, 'text-anchor': 'middle' }, 'A no nível 1'));
    svg.appendChild(el('text', { x: xs[1], y: B + 18, 'text-anchor': 'middle' }, 'A no nível 2'));
    [-1, 1].forEach((xb, k) => {
      const y1 = cel(-1, xb), y2 = cel(1, xb);
      svg.appendChild(el('line', { x1: xs[0], x2: xs[1], y1: Y(y1), y2: Y(y2), class: 'p-line' + k }));
      svg.appendChild(el('circle', { cx: xs[0], cy: Y(y1), r: 6, class: 'g' + k }));
      svg.appendChild(el('circle', { cx: xs[1], cy: Y(y2), r: 6, class: 'g' + k }));
      svg.appendChild(el('text', { x: xs[1] + 12, y: Y(y2) + 4, class: 'p-lbl' + k }, 'B' + (k + 1)));
    });
    o('a').textContent = fmt(a, 1); o('b').textContent = fmt(b, 1); o('ab').textContent = fmt(ab, 1);
    const eB1 = a - ab, eB2 = a + ab;
    out.innerHTML = Math.abs(ab) < 0.05
      ? 'Linhas <b>paralelas</b>: sem interação. Mudar A de 1 para 2 altera a resposta em ' + fmt(a, 1) + ' tanto em B1 quanto em B2.'
      : 'Linhas <b>não paralelas</b>: há interação. Mudar A de 1 para 2 altera a resposta em <b>' + fmt(eB1, 1) + '</b> quando B está em B1 e em <b>' + fmt(eB2, 1) + '</b> quando está em B2. O efeito de A depende de B.';
  }
  draw();
};

rota();
})();
